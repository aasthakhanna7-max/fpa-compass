/*IPREP_START*/const IPREP={"stages": [["Recruiter screen", "15–30 min", "Motivation, background, salary expectations and notice period. Have a crisp 60-second summary of your experience and why FP&A."], ["Hiring manager", "45–60 min", "Your experience in depth: planning cycles you've run, models you've built, stakeholders you've supported. Expect 'tell me about a time' questions."], ["Technical interview", "45–60 min", "Accounting links, budgeting and forecasting, variance analysis, modelling and Excel. Answers should be structured and use numbers."], ["Case study or modelling test", "1–3 hours", "Build a small forecast or analyse a dataset in Excel, then present findings. Accuracy, structure and the 'so what' matter more than speed."], ["Presentation and panel", "45–60 min", "Walk senior finance and business leaders through your case. They test how you communicate, handle challenge and make recommendations."], ["Final / culture", "30–45 min", "Values, working style and long-term fit, often with the CFO or a senior business partner. Prepare thoughtful questions."]], "star": [["Situation", "Set the scene in one or two sentences: the business, the team, the problem."], ["Task", "What you were responsible for, and what success looked like."], ["Action", "What you did, step by step. Say 'I', not 'we'. This should be the longest part."], ["Result", "The measurable outcome (time saved, accuracy gained, money found) and what you learned."]], "plan": [["Days 1–3", "Refresh foundations: the three statements and how they link, EBITDA vs cash, working capital, NPV/IRR. Re-read the job description and list the skills it emphasises."], ["Days 4–6", "Budgeting, forecasting and variance analysis. Practise explaining price-volume-mix and writing variance commentary out loud."], ["Days 7–9", "Excel and modelling. Build a small driver-based forecast from scratch in under an hour. Practise SUMIFS, INDEX/MATCH, XLOOKUP, pivots and data tables."], ["Days 10–11", "Write six STAR stories covering impact, influence, conflict, a mistake, process improvement and working under pressure."], ["Days 12–13", "Research the company: business model, revenue drivers, margins, recent results and industry KPIs. Prepare questions to ask."], ["Day 14", "Mock interview with a friend or record yourself. Review this guide's cheat sheet and get a good night's sleep."]], "topics": [{"t": "Accounting & financial statements", "qs": [{"q": "Walk me through the three financial statements and how they link.", "a": "The income statement shows revenue, costs and profit over a period. The balance sheet shows assets, liabilities and equity at a point in time. The cash flow statement explains the change in cash across operating, investing and financing activities. They link in three main ways: net income flows into retained earnings on the balance sheet and is the starting point of the cash flow statement; non-cash items and working capital changes reconcile net income to operating cash flow; and closing cash on the cash flow statement equals cash on the balance sheet.", "tip": "Finish with why it matters for FP&A: a forecast is only credible if it flows through all three."}, {"q": "If depreciation increases by $10, how does that flow through the statements? Assume a 25% tax rate.", "a": "Income statement: operating profit falls by $10, tax falls by $2.50, so net income falls by $7.50. Cash flow statement: start with net income down $7.50, add back the extra $10 of depreciation because it's non-cash, so operating cash flow rises by $2.50 (the tax saving). Balance sheet: PP&E falls by $10, cash rises by $2.50, and retained earnings fall by $7.50. Assets fall by $7.50 and equity falls by $7.50, so it balances.", "tip": "Interviewers want to see you walk through all three statements calmly and check that the balance sheet balances."}, {"q": "What's the difference between cash and accrual accounting, and why does it matter in FP&A?", "a": "Cash accounting records revenue and costs when cash moves. Accrual accounting records them when they're earned or incurred, regardless of cash timing. Company financial statements use accruals, which give a truer picture of performance in a period. For FP&A it matters because budgets and P&L forecasts are on an accrual basis, while liquidity planning needs a cash view. A business can hit its P&L budget and still run short of cash if customers pay late or inventory builds up.", "tip": ""}, {"q": "What is working capital, and how can a profitable company run out of cash?", "a": "Operating working capital is current operating assets (receivables, inventory) minus current operating liabilities (payables). When a company grows, it usually needs more receivables and inventory before it collects cash, so working capital absorbs cash. Add capex and debt repayments, and a profitable company can see cash fall. Example: a business growing 40% with 60 days of receivables needs about $3.3M of extra working capital for every $20M of new revenue.", "tip": "Mention the levers: DSO, DIO and DPO."}, {"q": "What's the difference between EBITDA, EBIT and net income? When would you use each?", "a": "EBITDA is earnings before interest, tax, depreciation and amortisation, a proxy for operating cash profit that's useful for comparing companies with different capital structures and asset bases. EBIT (operating profit) subtracts depreciation and amortisation, so it reflects the cost of using assets. Net income is the bottom line after interest and tax, what's left for shareholders. Use EBITDA for operating performance and leverage covenants, EBIT for operating efficiency, and net income for earnings per share and returns to equity.", "tip": "Add the caveat: EBITDA ignores capex, working capital and tax, so it can overstate cash generation."}, {"q": "What is deferred revenue? Give an example.", "a": "Deferred revenue is cash billed or received for goods or services not yet delivered. It's a liability because the company owes the customer the service. Example: a customer pays $12,000 upfront for a one-year subscription on 1 January. On day one, cash rises $12,000 and deferred revenue rises $12,000. Each month, $1,000 moves from deferred revenue to revenue. By 31 March, revenue recognised is $3,000 and deferred revenue is $9,000.", "tip": ""}, {"q": "How are capex and opex treated differently?", "a": "Operating expenses (salaries, rent, marketing) hit the income statement in full in the period they're incurred. Capital expenditure buys long-lived assets: it's recorded on the balance sheet and depreciated over the asset's useful life, so only the depreciation hits the income statement each year. In the cash flow statement, opex is in operating cash flow and capex is in investing cash flow. The classification affects EBITDA, so companies need clear capitalisation policies.", "tip": ""}, {"q": "What is free cash flow and how do you calculate it?", "a": "Free cash flow is the cash a business generates after funding its operations and capital investment, available to repay debt, pay dividends or reinvest. The common definition is operating cash flow minus capex. Unlevered free cash flow, used in valuation, is EBIT × (1 − tax rate) + depreciation and amortisation − capex − increase in net working capital.", "tip": "Mention that FP&A often tracks free cash flow conversion: free cash flow ÷ EBITDA."}, {"q": "A company buys $100 of inventory with cash. What happens to the three statements? What if it's later sold for $150?", "a": "On purchase: no income statement impact. On the balance sheet, inventory rises $100 and cash falls $100. On the cash flow statement, the increase in inventory is a $100 outflow in operating activities. When sold for $150 (cash): revenue $150, cost of goods sold $100, pre-tax profit $50. Inventory falls $100, cash rises $150, and retained earnings rise by the after-tax profit, with a tax liability or payment for the difference.", "tip": ""}]}, {"t": "Budgeting & planning", "qs": [{"q": "Walk me through how you would build an annual budget.", "a": "I'd run it in five steps. First, agree top-down targets with leadership from the strategic plan: growth, margin and capital. Second, issue a budget calendar, templates and assumptions (inflation, FX, headcount costs). Third, build bottom-up: revenue from drivers like volume, price and pipeline; headcount by role and start date; non-headcount spend by cost centre. Fourth, consolidate, compare with targets and close the gap through scenarios and trade-offs with budget owners. Fifth, get approval and phase the annual numbers by month for tracking.", "tip": "Give a real example of a budget cycle you've supported and how long it took."}, {"q": "What are the pros and cons of top-down and bottom-up budgeting?", "a": "Top-down is fast and aligned with strategy, but budget owners may not believe the numbers, so ownership is weak. Bottom-up builds ownership and operational realism, but it's slow and invites padding, and the total rarely matches leadership's ambition. Most companies combine the two: top-down targets set the envelope, bottom-up builds test it, and FP&A facilitates the gap closure.", "tip": ""}, {"q": "What is zero-based budgeting and when would you use it?", "a": "Zero-based budgeting builds each cost from zero, justifying every activity rather than starting from last year plus inflation. Costs are grouped into packages (travel, software, agencies) with owners and policies. It's effective for discretionary spend and cost resets, typically finding 10–25% savings, but it's resource-heavy. I'd use it for a cost transformation or every few years on discretionary categories, not for every line every year.", "tip": ""}, {"q": "How do you deal with a budget owner who you suspect is padding their budget?", "a": "Start with data, not accusations. Compare the request with historical run-rate, benchmarks and the drivers behind it (headcount, volumes, prices). Ask the owner to walk through the assumptions, and separate committed costs from discretionary ones. If there's a contingency, make it explicit and hold it centrally rather than spread across lines. Over time, driver-based budgets and tracking forecast bias make padding visible and less attractive.", "tip": "Show that you protect the relationship while holding the line."}, {"q": "What's the difference between a budget, a forecast and a target?", "a": "The budget is the approved annual plan: the yardstick for performance and resource allocation. A target is the goal leadership commits to; often the budget is the target. A forecast is the current best estimate of what will actually happen, updated regularly. Keeping them separate matters: if the forecast becomes a negotiation to match the target, it stops being honest and loses its value for decisions.", "tip": ""}, {"q": "How would you phase an annual budget by month?", "a": "Use the drivers rather than dividing by twelve. Revenue follows seasonality from history and known events such as price increases or launches. Headcount costs follow planned start dates, merit-increase timing and bonus accruals. Non-headcount costs follow contracts and campaigns: rent evenly, marketing by campaign calendar, annual licences when paid or amortised. Then check that phased totals reconcile to the annual numbers and that the monthly P&L looks plausible.", "tip": ""}, {"q": "How do you build a headcount budget?", "a": "Plan at the position level: existing employees, open roles and planned hires, each with department, salary, burden rate (benefits and employer taxes), start date and status. Add merit increases, bonuses and commissions, and an allowance for attrition and hiring delays. Monthly cost is loaded salary ÷ 12 for each month employed. Finally, show next year's run-rate step-up, because hires late in the year cost little now but a full year next year.", "tip": ""}, {"q": "Leadership wants 15% EBITDA growth, but the bottom-up budget shows 8%. What do you do?", "a": "First, quantify the gap and understand what drives the bottom-up number. Then build a gap-closure plan with options, each with value, risk and owner: pricing actions, cost efficiencies, hiring timing, revenue initiatives. Show scenarios so leadership can see the trade-offs, for example what has to be true to reach 15% and which options carry delivery risk. The goal isn't to force the number but to give leadership a clear, quantified choice.", "tip": "This is a business partnering question: show you'd facilitate the decision, not just report the gap."}]}, {"t": "Forecasting", "qs": [{"q": "What is a rolling forecast and why would a company use one?", "a": "A rolling forecast always looks a fixed distance ahead, typically 12 to 18 months, adding a new period each time one closes. Unlike a year-end forecast, it doesn't go blind in Q4. It supports hiring and investment decisions with a consistent horizon, encourages driver-based planning, and makes the annual budget faster because the next year is already partly built.", "tip": "Mention the design choices that make it work: drivers not accounts, separate target and forecast, measure accuracy."}, {"q": "What is driver-based forecasting? Give an example.", "a": "Driver-based forecasting models financial results as functions of operational drivers. For an e-commerce business: revenue = site visits × conversion rate × average order value; marketing cost = visits × cost per visit; fulfilment cost = orders × cost per order. Change a driver and the P&L updates. It makes forecasts explainable, scenarios fast, and conversations with the business focused on levers they control.", "tip": ""}, {"q": "How do you measure forecast accuracy?", "a": "Accuracy for a period is 1 − |actual − forecast| ÷ actual. Over many periods, use mean absolute percentage error (MAPE) for the size of errors and bias, Σ(forecast − actual) ÷ Σ actual, for direction. Bias is often more useful: a forecast that's always 3% too high has a fixable cause, such as optimistic pipeline probabilities. Track accuracy by driver and business unit, not just in total, so you know where to improve.", "tip": ""}, {"q": "How would you forecast revenue for a new product with no history?", "a": "Use a combination of approaches. Top-down: market size × target share, sense-checked against comparable launches. Bottom-up: sales capacity × ramp-up × win rate × deal size, or distribution points × sales per point. Analogues: the adoption curve of a similar past product. Then run scenarios, document assumptions, agree leading indicators to track (trials, pipeline, early orders) and update quickly as real data arrives.", "tip": ""}, {"q": "Which forecasting methods do you know, and when would you use each?", "a": "Run-rate and moving averages for stable, low-value lines. Trend and regression for lines with a steady relationship to time or another variable. Seasonal models for businesses with predictable seasonality. Driver-based models for the big lines where operational levers matter. Judgmental input from sales or operations for known events. Most good forecasts combine methods, and you measure accuracy by method to keep what works.", "tip": ""}, {"q": "What's the difference between scenario analysis and sensitivity analysis?", "a": "Sensitivity analysis changes one assumption at a time to see how much the output moves, often shown in a tornado chart. Scenario analysis changes several assumptions together to describe a coherent alternative future, such as a recession case with lower volume, price pressure and slower collections. Use sensitivity to find the assumptions that matter most, and scenarios to plan responses, ideally with triggers and pre-agreed actions.", "tip": ""}, {"q": "Your quarterly forecast missed actuals by 10%. How would you investigate?", "a": "Break the miss down. Was it revenue or cost? Which business units, products or customers? Was it volume, price or mix? Timing (it will reverse) or permanent? Then check the forecast process: were the driver assumptions wrong, was information late, or was there bias? I'd talk to the people closest to the numbers, document the root cause, fix the assumption or process, and track whether accuracy improves next cycle.", "tip": ""}, {"q": "How often should a company reforecast?", "a": "It depends on volatility and decision cadence. Many companies do a light monthly update of key drivers with a fuller quarterly reforecast. Fast-moving or cash-constrained businesses may forecast weekly for cash. The principle: forecast as often as decisions need it, focus on drivers that change, and avoid rebuilding every line, which causes forecast fatigue.", "tip": ""}]}, {"t": "Variance analysis & reporting", "qs": [{"q": "How do you perform variance analysis?", "a": "Compare actuals with budget, forecast or prior year at the right level of detail. Apply materiality thresholds, often both a percentage and an absolute amount, to decide what to explain. Label each variance favorable or unfavorable, and timing or permanent. Find the business cause by talking to budget owners rather than guessing from the ledger. Then write commentary that covers cause, impact, type and implication for the forecast, and recommend action where needed.", "tip": ""}, {"q": "Revenue is up versus budget but gross margin % is down. How would you analyse it?", "a": "Run a price-volume-mix analysis on both revenue and gross margin. Revenue up with margin % down usually points to adverse mix (more lower-margin products or customers), price discounting, or unit cost increases. I'd quantify each effect by product, check input costs and discounts, and look at customer and channel mix. The output is a bridge from budget to actual gross margin with a clear explanation of each step.", "tip": ""}, {"q": "Explain price-volume-mix with a simple example.", "a": "Budget: 100 units of A at $10 and 100 of B at $5, revenue $1,500. Actual: 80 of A at $11 and 140 of B at $5, revenue $1,580. Price effect = (11 − 10) × 80 = +$80. Volume effect: total units rose from 200 to 220, at the budget average price of $7.50, so +$150. Mix effect: the share of A fell from 50% to 36%, worth −$150. Check: 80 + 150 − 150 = +$80 = 1,580 − 1,500.", "tip": "Practise doing this on paper. Many interviewers ask you to calculate it."}, {"q": "What makes good variance commentary?", "a": "Good commentary answers 'do I need to do anything?'. It states the business cause (not 'travel was higher due to more travel'), the impact with favorable or unfavorable, whether it's timing or permanent, and the implication for the full-year forecast, plus any decision needed. It leads with a headline for the month and explains only material variances.", "tip": "Give a before-and-after example from your own experience."}, {"q": "Is a favorable variance always good?", "a": "No. Lower marketing spend is favorable to budget but may hurt next quarter's pipeline. A delayed hire saves money but may delay a product launch. Higher revenue from a one-off deal may hide weakness in the core business. Always ask whether the variance reflects better performance, timing, or a decision that creates a problem later.", "tip": ""}, {"q": "How do you decide which variances to explain?", "a": "Use materiality thresholds agreed with finance leadership, typically both an absolute amount and a percentage, so you don't chase large percentages on tiny lines or small percentages on huge ones. Also explain anything strategically sensitive, recurring trends even if individually small, and variances that change the full-year outlook.", "tip": ""}, {"q": "What would you include in a monthly management pack?", "a": "A one-page summary with the headline and decisions needed; a P&L versus budget and forecast with an EBITDA bridge; a KPI scorecard with leading and lagging indicators and traffic-light status; cash and working capital; the updated full-year forecast and risks and opportunities; and appendices with detail by business unit. Keep it short: every page should answer 'so what?'.", "tip": ""}, {"q": "What's the difference between leading and lagging KPIs? Give examples.", "a": "Lagging indicators report outcomes that already happened: revenue, EBITDA, margin, cash. Leading indicators predict future outcomes: pipeline coverage, website conversion, customer churn signals, hiring pipeline, backlog. A good scorecard balances both, because lagging indicators tell you where you are and leading indicators give you time to act.", "tip": ""}]}, {"t": "Financial modelling & Excel", "qs": [{"q": "How do you structure a financial model?", "a": "Separate inputs, calculations and outputs. Inputs (assumptions) sit on one clearly labelled sheet, colour-coded blue. Calculations flow logically left to right and top to bottom with consistent formulas across each row. Outputs (summary, charts, dashboards) only reference calculations. Add checks (balance sheet balances, totals reconcile to source), a cover sheet explaining the model, and version control.", "tip": ""}, {"q": "Which Excel functions do you use most in FP&A?", "a": "SUMIFS and COUNTIFS for aggregation; INDEX/MATCH or XLOOKUP for lookups; IF, IFERROR and nested logic; EOMONTH and EDATE for dates; SUMPRODUCT for weighted calculations; pivot tables for analysis; data tables and Goal Seek for sensitivities; and conditional formatting for exceptions. Increasingly, Power Query for data preparation and dynamic arrays like FILTER and UNIQUE.", "tip": "Be ready to write one of these live."}, {"q": "Why use INDEX/MATCH or XLOOKUP instead of VLOOKUP?", "a": "VLOOKUP only looks to the right, breaks if columns are inserted because it uses a hard-coded column number, and defaults to approximate match. INDEX/MATCH and XLOOKUP can look in any direction, don't break when columns move, and are clearer to audit. XLOOKUP also handles not-found values and exact match by default.", "tip": ""}, {"q": "How do you check a model for errors?", "a": "Build checks into the model: totals that reconcile to source data, balance sheet balancing, phasing that totals 100%. Use consistent formulas across rows and spot-check with trace precedents. Test extreme inputs (zero, negative, very large) to see if outputs behave sensibly. Reconcile key outputs to an independent rough calculation. Finally, have someone else review the logic.", "tip": ""}, {"q": "Explain NPV and IRR. Which would you rely on?", "a": "NPV discounts future cash flows at the cost of capital and subtracts the initial investment: positive NPV creates value. IRR is the discount rate at which NPV equals zero. For a single, conventional project they usually agree. For ranking mutually exclusive projects, I'd rely on NPV because it measures absolute value. IRR can favour small projects with high percentage returns and can give multiple answers when cash flows change sign more than once.", "tip": ""}, {"q": "How would you evaluate a capital investment?", "a": "Forecast incremental cash flows only: upfront capex, operating savings or revenue, extra operating costs, working capital, tax (including the depreciation tax shield) and any terminal value. Discount at the appropriate hurdle rate to get NPV, and calculate IRR, payback and profitability index. Run sensitivities on the key assumptions, assess strategic and non-financial factors, and plan a post-investment review.", "tip": ""}, {"q": "What is WACC and how is it calculated?", "a": "The weighted average cost of capital is the blended return required by lenders and shareholders. WACC = E/(D+E) × cost of equity + D/(D+E) × cost of debt × (1 − tax rate). Cost of equity is often estimated with CAPM: risk-free rate + beta × equity risk premium. Companies use WACC, sometimes plus a risk premium, as the hurdle rate for investments.", "tip": ""}, {"q": "How do you handle circular references in a model?", "a": "Avoid them where possible, for example by calculating interest on opening rather than average debt balances. If a circularity is genuinely needed, isolate it, add a switch to turn it off, and enable iterative calculation deliberately. Never leave accidental circular references, because they can hide errors and make the model unstable.", "tip": ""}, {"q": "When would you use a data table or Goal Seek?", "a": "Data tables show how an output changes across a range of one or two inputs, for example NPV across discount rates and volume assumptions. They're good for sensitivity grids. Goal Seek finds the input value needed to hit a target, such as the price needed to break even or the volume needed to reach a margin goal. For repeated scenarios, a scenario selector driving the whole model is more robust.", "tip": ""}]}, {"t": "Metrics, costs & unit economics", "qs": [{"q": "What are contribution margin and break-even? Show a calculation.", "a": "Contribution margin is revenue minus variable costs: what each unit contributes to fixed costs and profit. Break-even is fixed costs ÷ contribution per unit. Example: price $50, variable cost $30, fixed costs $200,000. Contribution is $20, so break-even is 10,000 units. If expected sales are 12,500 units, the margin of safety is (12,500 − 10,000) ÷ 12,500 = 20%.", "tip": ""}, {"q": "What is operating leverage?", "a": "Operating leverage measures how sensitive profit is to changes in volume, and it's driven by the share of fixed costs. A business with high fixed costs (software, airlines) sees profit rise quickly as volume grows past break-even, and fall quickly when volume drops. Degree of operating leverage = contribution ÷ operating profit. It matters for forecasting and for assessing downside risk.", "tip": ""}, {"q": "Explain CAC, LTV, CAC payback and net revenue retention.", "a": "CAC is sales and marketing spend ÷ new customers acquired. LTV is the gross-margin-adjusted value of a customer over their lifetime, often ARPA × gross margin ÷ churn rate. CAC payback is CAC ÷ (monthly ARPA × gross margin), in months. Net revenue retention is (starting recurring revenue + expansion − contraction − churn) ÷ starting recurring revenue. Common benchmarks are LTV:CAC of at least 3x, payback under 18 months and NRR above 100%.", "tip": ""}, {"q": "What is the cash conversion cycle, and how can a company improve it?", "a": "CCC = DSO + DIO − DPO: the days cash is tied up between paying suppliers and collecting from customers. To improve it: reduce DSO with faster invoicing, fewer billing disputes and better collections; reduce DIO through demand planning and SKU rationalisation; and extend DPO carefully through negotiated terms, without damaging supplier relationships. Each day saved releases about annual revenue (or COGS) ÷ 365 of cash, one time.", "tip": ""}, {"q": "How would you analyse the profitability of a product or customer?", "a": "Start with revenue less direct costs to get contribution margin. Then allocate shared costs using drivers that reflect usage, such as activity-based costing for service, logistics or support, and show margin before and after allocation. Look at trends, cost-to-serve, discounts and payment terms. The aim is to find products or customers that look profitable at gross margin level but aren't once their true cost to serve is included.", "tip": ""}, {"q": "Which financial ratios would you use to assess a company's health?", "a": "Profitability: gross, EBITDA and net margins, return on capital. Liquidity: current ratio, quick ratio, cash runway. Leverage: net debt / EBITDA, interest cover. Efficiency: asset turnover, DSO, DIO, DPO. Cash: free cash flow and free cash flow conversion. I'd compare them over time and against peers rather than in isolation.", "tip": ""}, {"q": "What is a debt covenant and how does FP&A monitor it?", "a": "A covenant is a condition in a loan agreement, such as maximum net debt / EBITDA or minimum interest cover. Breaching it can trigger penalties or let the lender demand repayment. FP&A forecasts covenant ratios alongside the P&L, balance sheet and cash flow, shows headroom in every scenario, and flags risks early so management can act.", "tip": ""}]}, {"t": "Business partnering & behavioural", "qs": [{"q": "Why do you want to work in FP&A?", "a": "Link your answer to what FP&A actually does: helping leaders make better decisions about resources. Mention what you enjoy (understanding how a business makes money, building models that answer real questions, working with operational teams) and back it up with a specific example from your experience. End with why this company and role in particular.", "tip": "Avoid generic answers like 'I like numbers'."}, {"q": "Tell me about a time your analysis changed a business decision.", "a": "Use STAR. Pick an example where you identified something others hadn't, quantified it and influenced a decision: a pricing change, a hiring decision, cost savings or reallocating budget. Be specific about what you analysed, how you presented it, who you convinced and the measurable result. This is often the most important question in an FP&A interview.", "tip": ""}, {"q": "Tell me about a time you pushed back on a senior stakeholder.", "a": "Show that you challenged with data and respect. Explain the situation, the concern (for example an unrealistic forecast or an investment without a clear return), how you prepared your evidence, how you raised it privately first, and the outcome. Strong answers show you preserved the relationship and focused on the business outcome rather than being right.", "tip": ""}, {"q": "How do you explain complex financial information to non-finance people?", "a": "Start with the conclusion and what it means for them. Use their language and metrics rather than accounting terms, and link financial results to operational drivers they control. Use visuals such as bridges, trends and simple charts instead of dense tables. Check understanding, and keep the detail available for those who want it.", "tip": "Give an example of a pack or presentation you simplified."}, {"q": "Tell me about a mistake you made and what you learned.", "a": "Choose a real but recoverable mistake, such as an error in a report or a wrong assumption in a model. Explain how you found it, how quickly you owned it and fixed it, how you communicated it, and what control you put in place so it doesn't happen again. Interviewers value honesty and the improvement you made.", "tip": ""}, {"q": "How do you prioritise when month-end close and urgent ad hoc requests collide?", "a": "Clarify the deadline and the decision each request supports. Month-end deliverables have fixed deadlines and many dependants, so protect them. For ad hoc requests, agree scope and timing with the requester: a rough answer today may be enough. Communicate trade-offs early, and if priorities conflict, escalate to your manager with a recommendation rather than a problem.", "tip": ""}, {"q": "Describe a process you improved or automated.", "a": "Use STAR with numbers: the manual process (hours, errors, handoffs), what you changed (a better template, Power Query, a planning tool, a driver-based model, a new close calendar), how you got buy-in, and the result, such as hours saved, faster close or better accuracy.", "tip": ""}, {"q": "How do you build strong relationships with business partners?", "a": "Learn their business: the operational metrics, what keeps them up at night and the decisions they make. Be useful early by fixing something that frustrates them. Bring insight and recommendations, not just reports. Be reliable with deadlines and numbers. And be honest when the numbers say no, ideally with an alternative.", "tip": ""}, {"q": "Tell me about a time you had to work with incomplete or messy data.", "a": "Explain how you assessed what data was available and its reliability, how you filled gaps (proxies, assumptions agreed with stakeholders, sampling), how you made assumptions transparent, and how you communicated the level of confidence. Strong answers show pragmatism: delivering a useful answer on time while improving the data for next time.", "tip": ""}, {"q": "How do you see FP&A changing over the next few years?", "a": "Discuss automation of data preparation, connected planning platforms that link finance and operational plans, AI-assisted forecasting and commentary, and the shift of FP&A time from producing numbers to interpreting them and influencing decisions. Then say how you're preparing: building systems and data skills while strengthening business understanding and communication.", "tip": ""}]}, {"t": "Case questions (worked)", "qs": [{"q": "Revenue grew 10% versus last year, but EBITDA fell 5%. How would you diagnose it?", "a": "Structure the analysis. 1) Gross margin: did margin % fall because of price discounts, adverse mix or higher input costs? Run price-volume-mix. 2) Operating costs: did opex grow faster than revenue? Split it into people (headcount, salary inflation), marketing and other costs, and separate one-offs from run-rate. 3) Quality of growth: was the growth from low-margin customers, acquisitions or a promotion? Build an EBITDA bridge from last year to this year with each driver quantified, then recommend actions.", "tip": "Say your structure out loud before diving into numbers."}, {"q": "Should we hire five sales reps at $120k fully loaded each? Each should produce $400k of annual revenue at a 60% gross margin, after a six-month ramp.", "a": "At full productivity, each rep generates $400k × 60% = $240k of gross profit against $120k of cost: a $120k annual contribution, so 2x. In year one, assume a straight-line ramp from zero to full productivity over six months (50% on average), then 100% for the next six: about 75% of $240k = $180k gross profit against $120k cost, so +$60k per rep. Five reps add about $300k of contribution in year one and $600k a year after that. Then test the risks: ramp time, attrition, pipeline capacity and whether the market can support the revenue.", "tip": "Interviewers care about the structure and the sensitivity, not the exact ramp assumption."}, {"q": "A customer asks for a 10% price discount in exchange for 20% more volume. Gross margin is 40%. Should we accept?", "a": "Use revenue of 100 at 40% margin: cost of goods 60, gross profit 40. With a 10% discount and 20% more volume: revenue = 100 × 0.9 × 1.2 = 108; cost = 60 × 1.2 = 72; gross profit = 36. Gross profit falls from 40 to 36, so the deal destroys value unless there are other benefits, for example using spare capacity with lower marginal cost, strategic account value, or preventing loss of the customer. Break-even volume increase for a 10% discount at 40% margin is 10% ÷ (40% − 10%) = 33%.", "tip": ""}, {"q": "The company is profitable but cash keeps falling. What do you look at?", "a": "Reconcile profit to cash. Check working capital: rising receivables (slower collections, longer terms, disputes), rising inventory (overstocking, slow-moving items) and falling payables (suppliers paid faster). Check capex and capitalised costs, debt repayments, tax payments, dividends and one-off items. Build a cash bridge from EBITDA to change in cash, and set up a 13-week cash forecast to manage liquidity while you fix the root causes.", "tip": ""}, {"q": "How would you build a revenue forecast for a coffee chain opening 10 new stores next year?", "a": "Model by store. Revenue per store = customers per day × average ticket × trading days, ramping up over the first months after opening. Take customers and ticket from existing comparable stores, adjusted for location. Phase openings by month, since a store opening in October contributes little this year. Add like-for-like growth for existing stores. Then sense-check against total sales per store in the current estate, and build scenarios for opening delays and slower ramp.", "tip": ""}]}], "excel": [["Lookups", "XLOOKUP, INDEX/MATCH, two-way INDEX/MATCH/MATCH"], ["Aggregation", "SUMIFS, COUNTIFS, AVERAGEIFS, SUMPRODUCT"], ["Logic & errors", "IF, IFS, AND/OR, IFERROR, ISBLANK"], ["Dates", "EOMONTH, EDATE, NETWORKDAYS, WORKDAY, YEAR/MONTH"], ["Text", "TEXT, LEFT/RIGHT/MID, CONCAT / TEXTJOIN, TRIM"], ["Dynamic arrays", "FILTER, UNIQUE, SORT, SEQUENCE"], ["Finance", "NPV, XNPV, IRR, XIRR, PMT"], ["Analysis", "Pivot tables, data tables, Goal Seek, scenario selector"], ["Data prep", "Power Query basics, removing duplicates, data validation"], ["Speed", "Shortcuts: Ctrl+Arrow, Ctrl+Shift+Arrow, F2, F4 (anchoring), Alt+= (AutoSum), Ctrl+[ (trace precedents)"]], "case": [["Read the brief twice", "Underline the question you're being asked and any constraints. Note the deliverable: a number, a recommendation, a model, slides."], ["Plan before you build", "Sketch the output first, then the calculations and inputs it needs. Spend the first 10% of the time planning."], ["Structure the workbook", "Inputs, calculations and outputs on separate sheets. Colour-code inputs. Keep formulas consistent across rows."], ["Check as you go", "Reconcile totals to the data provided. Add a few checks. Sense-check results against rough mental maths."], ["State your assumptions", "List every assumption clearly. Interviewers care more that it's explicit and reasonable than that it's 'right'."], ["Lead with the answer", "Present the recommendation first, then the two or three insights behind it, then the risks and next steps."], ["Prepare for challenge", "Know which assumptions drive the answer most, and what would change your recommendation."]], "ask": ["What are the biggest decisions this team will support in the next 12 months?", "How is FP&A seen by the business today, and how would you like that to change?", "What does the planning and forecasting cycle look like, and which tools do you use?", "What would success look like in this role after six months?", "What's the biggest challenge the finance team is facing right now?", "How do you measure forecast accuracy, and how has it trended?", "Who are the main stakeholders I'd partner with, and what do they value most?", "How does the team develop people? Where have previous people in this role moved on to?"], "cheat": [["Gross margin %", "(Revenue − COGS) ÷ Revenue"], ["EBITDA", "EBIT + Depreciation + Amortisation"], ["Free cash flow", "Operating cash flow − Capex"], ["Variance %", "(Actual − Budget) ÷ |Budget|"], ["Break-even units", "Fixed costs ÷ (Price − Variable cost per unit)"], ["Margin of safety", "(Expected sales − Break-even sales) ÷ Expected sales"], ["DSO / DIO / DPO", "AR ÷ Revenue × 365 · Inventory ÷ COGS × 365 · AP ÷ COGS × 365"], ["Cash conversion cycle", "DSO + DIO − DPO"], ["NPV", "Σ CFₜ ÷ (1 + r)ᵗ − Initial investment"], ["WACC", "E/V × Re + D/V × Rd × (1 − t)"], ["CAGR", "(End ÷ Start)^(1/n) − 1"], ["Forecast accuracy", "1 − |Actual − Forecast| ÷ Actual"], ["Net debt / EBITDA", "(Debt − Cash) ÷ EBITDA"], ["LTV", "ARPA × Gross margin % ÷ Churn rate"], ["CAC payback (months)", "CAC ÷ (Monthly ARPA × Gross margin %)"], ["Net revenue retention", "(Start ARR + Expansion − Contraction − Churn) ÷ Start ARR"]], "check": [["The week before", ["Re-read the job description and map your stories to each requirement", "Research the company's results, business model and industry KPIs", "Practise the three-statement walk-through and a PVM calculation out loud", "Do one timed Excel exercise"]], ["The day before", ["Prepare your 60-second introduction", "Print or save your CV and notes", "Check the interview format, names and titles of interviewers", "Prepare 3–4 questions to ask"]], ["On the day", ["Have a calculator, pen and paper ready", "Structure answers: headline first, then detail", "Use numbers in every example", "Ask for clarification on case questions before answering", "Send a short thank-you note afterwards"]]]};/*IPREP_END*/

let dlCap, bundle=null; const dlReady=(async()=>{ try{ dlCap=window.claude?.use?await window.claude.use("downloads"):null; }catch(e){ dlCap=null; } })();
async function downloadFile(file,statusEl){
  const say=t=>{ if(statusEl) statusEl.textContent=t; };
  if(!window.claude?.use){ const a=document.createElement("a"); a.href="templates/"+file; a.download=file; document.body.appendChild(a); a.click(); a.remove(); say("Download started: "+file); return; }
  say("Preparing "+file+"…");
  await dlReady;
  if(!dlCap){ say("Downloads aren't available in this view. Open the page in a browser to download."); return; }
  try{
    if(!bundle){ const res=await fetch("templates/bundle.json"); if(!res.ok) throw {code:"fetch"}; bundle=await res.json(); }
    const b64=bundle[file]; if(!b64) throw {code:"fetch"};
    const bin=atob(b64), bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const blob=new Blob([bytes]);
    await dlCap.save({filename:file,data:blob}); say("Saved "+file);
  }catch(e){
    const c=e&&e.code;
    say(c==="declined"?"Download cancelled.":c==="rate_limited"?"Another download is waiting for confirmation. Try again in a moment.":c==="fetch"?"Couldn't load the file. Refresh the page and try again.":"Download isn't available here. Open the page in a browser to download.");
  }
}

/* Charts */
function niceTicks(lo,hi,count){
  const span=hi-lo||1, raw=span/count, mag=Math.pow(10,Math.floor(Math.log10(raw))), norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const start=Math.floor(lo/step)*step, end=Math.ceil(hi/step)*step, t=[];
  for(let q=start; q<=end+step/2; q+=step) t.push(Math.round(q/step)*step);
  return t;
}
function waterfall(items,{height=290,fmt=x=>x,ink="var(--ink)",muted="var(--muted)",rule="var(--rule)",fixed=null}={}){
  const Wd=660,H=height,padL=62,padR=12,padT=26,padB=52;
  let run=0; const bars=items.map(it=>{ if(it.total){ run=it.value; return {...it,y0:0,y1:it.value}; } const b={...it,y0:run,y1:run+it.value}; run+=it.value; return b; });
  const lo=Math.min(0,...bars.map(b=>Math.min(b.y0,b.y1))), hi=Math.max(...bars.map(b=>Math.max(b.y0,b.y1)));
  const ticks=fixed||niceTicks(lo,hi,5), dMin=ticks[0], dMax=ticks[ticks.length-1];
  const y=q=>padT+(H-padT-padB)*(1-(q-dMin)/(dMax-dMin));
  const n=bars.length, slot=(Wd-padL-padR)/n, bw=Math.min(56,slot*.62);
  let g=`<svg class="wf" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Waterfall chart">`;
  ticks.forEach(t=>{ g+=`<line x1="${padL}" x2="${Wd-padR}" y1="${y(t)}" y2="${y(t)}" stroke="${rule}"/><text x="${padL-8}" y="${y(t)+4}" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="${muted}">${fmt(t)}</text>`; });
  bars.forEach((b,i)=>{
    const x=padL+slot*i+(slot-bw)/2, top=y(Math.max(b.y0,b.y1)), bot=y(Math.min(b.y0,b.y1));
    const fill=b.total?(b.color||"var(--total)"):(b.value>=0?"var(--fav)":"var(--unfav)");
    g+=`<rect x="${x}" y="${top}" width="${bw}" height="${Math.max(1.5,bot-top)}" rx="2" fill="${fill}"><title>${esc(b.label)}: ${fmt(b.value)}</title></rect>`;
    if(i<n-1) g+=`<line x1="${x+bw}" x2="${x+slot}" y1="${y(b.y1)}" y2="${y(b.y1)}" stroke="${muted}" stroke-dasharray="2 2"/>`;
    const lbl=b.total?fmt(b.value):(b.value>=0?"+":"−")+fmt(Math.abs(b.value));
    g+=`<text x="${x+bw/2}" y="${top-7}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="500" fill="${ink}">${lbl}</text>`;
    const words=b.label.split(" "), lines=[]; let cur="";
    words.forEach(w=>{ if((cur+" "+w).trim().length>11&&cur){ lines.push(cur); cur=w; } else cur=(cur+" "+w).trim(); }); lines.push(cur);
    lines.slice(0,3).forEach((ln,j)=>{ g+=`<text x="${x+bw/2}" y="${H-padB+18+j*13}" text-anchor="middle" font-family="Manrope, sans-serif" font-size="11" fill="${muted}">${esc(ln)}</text>`; });
  });
  return g+`<line x1="${padL}" x2="${Wd-padR}" y1="${y(0)}" y2="${y(0)}" stroke="${ink}"/></svg>`;
}
function columns(vals,{labels,colorFn,fmt=x=>x,height=220,line=null,lineColor="var(--muted)",marker=null,ref=null}){
  const Wd=660,H=height,pl=60,pr=10,pt=14,pb=28, all=[...vals,...(line||[]),...(ref!=null?[ref]:[])];
  const ticks=niceTicks(Math.min(0,...all),Math.max(0,...all)*1.05,4), t0=ticks[0], t1=ticks[ticks.length-1], y=q=>pt+(H-pt-pb)*(1-(q-t0)/(t1-t0)), slot=(Wd-pl-pr)/vals.length, bw=slot*.62;
  let s=`<svg class="wf" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Column chart">`;
  ticks.forEach(t=>s+=`<line x1="${pl}" x2="${Wd-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--rule)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="11" font-family="JetBrains Mono, monospace" fill="var(--muted)">${fmt(t)}</text>`);
  vals.forEach((q,i)=>{ const x=pl+slot*i+(slot-bw)/2; s+=`<rect x="${x}" y="${y(Math.max(0,q))}" width="${bw}" height="${Math.max(1,Math.abs(y(q)-y(0)))}" rx="2" fill="${colorFn(q,i)}"><title>${labels[i]}: ${fmt(q)}</title></rect><text x="${x+bw/2}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="Manrope, sans-serif">${labels[i]}</text>`; });
  if(line) s+=`<polyline fill="none" stroke="${lineColor}" stroke-width="2" points="${line.map((q,i)=>`${pl+slot*i+slot/2},${y(q)}`).join(" ")}"/>`;
  if(ref!=null) s+=`<line x1="${pl}" x2="${Wd-pr}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4"/>`;
  if(marker!=null) s+=`<line x1="${pl+slot*marker}" x2="${pl+slot*marker}" y1="${pt}" y2="${H-pb}" stroke="var(--ink)" stroke-dasharray="3 3"/>`;
  return s+`<line x1="${pl}" x2="${Wd-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink)"/></svg>`;
}

W.npv={title:"Investment appraisal: test the business case",html:()=>`<div class="sliders">${slider("n-inv","Initial investment",500,5000,100,2000,x=>"$"+x.toLocaleString()+"k")}${slider("n-ben","Annual net benefit",100,1500,25,650,x=>"$"+x+"k")}${slider("n-yrs","Benefit years",2,10,1,5,x=>x+" yrs")}${slider("n-r","Discount rate (WACC)",4,20,0.5,10,x=>x.toFixed(1)+"%")}</div><div class="kpis" id="npv-k"></div><div id="npv-chart"></div><div class="legend"><span><i style="background:var(--brand)"></i>Cumulative discounted cash flow (negative)</span><span><i style="background:var(--fav)"></i>Paid back</span></div>`,
 bind(){ bindSliders(["n-inv","n-ben","n-yrs","n-r"],[x=>"$"+x.toLocaleString()+"k",x=>"$"+x+"k",x=>x+" yrs",x=>x.toFixed(1)+"%"],()=>{ const inv=val("n-inv"), b=val("n-ben"), n=val("n-yrs"), r=val("n-r")/100;
   const f=x=>{ let s=-inv; for(let t=1;t<=n;t++) s+=b/Math.pow(1+x,t); return s; };
   let npv=-inv; const cum=[-inv]; for(let t=1;t<=n;t++){ npv+=b/Math.pow(1+r,t); cum.push(npv); }
   let lo=0,hi=5,irr=NaN; if(f(0)>0){ for(let k=0;k<80;k++){ const m=(lo+hi)/2; f(m)>0?lo=m:hi=m; } irr=lo; }
   const pb=inv/b, pi=1+npv/inv;
   $("#npv-k").innerHTML=kpi("NPV",(npv<0?"−":"")+"$"+Math.abs(npv).toFixed(0)+"k",npv>=0,npv>=0?"Creates value":"Destroys value")+kpi("IRR",isFinite(irr)?(irr*100).toFixed(1)+"%":"n/a",irr>r,irr>r?"Above hurdle":"Below hurdle")+kpi("Simple payback",pb.toFixed(1)+" yrs",pb<=n,pb<=n?"Within benefit life":"Beyond benefit life")+kpi("Profitability index",pi.toFixed(2)+"x",pi>=1,"");
   $("#npv-chart").innerHTML=columns(cum,{labels:cum.map((_,i)=>"Y"+i),colorFn:q=>q>=0?"var(--fav)":"var(--brand)",fmt:x=>(x<0?"−":"")+"$"+Math.abs(Math.round(x)).toLocaleString()+"k"}); }); }};

   $("#recon tbody").innerHTML=OPPS.map(([n,c,s])=>{ const d=s-c, p=d/c; let f,cl; if(s===0||p<=-t){ f=s===0?"Under: no staffing":"Under: missing staffing"; cl="bad"; u++; uv+=-d; } else if(p>=t){ f="Over: write-off risk"; cl="mid"; o++; } else { f="Aligned"; cl="ok"; } return `<tr><td>${n}</td><td>$${c}k</td><td>$${s}k</td><td class="${d>=0?"fav":"unfav"}">${acct(d)}</td><td class="${d>=0?"fav":"unfav"}">${pct(p)}</td><td class="txt"><span class="pill ${cl}">${f}</span></td></tr>`; }).join("");
   $("#r-k").innerHTML=kpi("Under-forecast",u,!u,"$"+uv+"k unstaffed revenue")+kpi("Over-forecast",o,!o,"Write-off risk")+kpi("Aligned",OPPS.length-u-o,true,"No action"); }); }};

W.capacity={title:"Supply vs demand: find the shortfall weeks",html:()=>`<div class="chips" id="cap-chips"></div><div class="sliders">${slider("cap-bench","Redeploy bench (FTE)",0,20,1,0,x=>"+"+x)}${slider("cap-att","Attrition (FTE / month)",0,8,1,3,x=>x)}${slider("cap-prob","Pipeline probability",30,100,5,60,x=>x+"%")}</div><div class="kpis" id="cap-k"></div><div id="cap-chart"></div><div class="legend"><span><i style="background:var(--brand)"></i>Supply FTE</span><span><i style="background:var(--accent)"></i>Demand FTE (sold + weighted pipeline)</span><span><i style="background:var(--unfav)"></i>Shortfall week</span></div>`,
 bind(){ const P={"All practices":[310,1],"Finance":[120,.39],"Supply chain":[95,.31],"Technology":[95,.31]}; let pr="All practices";
  $("#cap-chips").innerHTML=Object.keys(P).map(k=>`<button class="chip" type="button" data-p="${k}" aria-pressed="${k===pr}">${k}</button>`).join("");
  const sold=[300,302,298,295,290,284,276,270,262,255,248,240], pipe=[5,10,18,26,34,42,50,58,64,70,76,82];
  const draw=()=>{ const [base,sh]=P[pr], bench=val("cap-bench"), att=val("cap-att"), prob=val("cap-prob")/100;
   const sup=sold.map((_,i)=>base*sh/(pr==="All practices"?1:sh)*(pr==="All practices"?1:1)+bench*sh-att*sh*i/4.33), dem=sold.map((s,i)=>(s+pipe[i]*prob)*sh);
   const gap=sup.map((s,i)=>s-dem[i]), first=gap.findIndex(g=>g<0), shortW=gap.filter(g=>g<0).length;
   $("#cap-k").innerHTML=kpi("First shortfall",first<0?"None":"Week "+(first+1),first<0||first>=3,first<0?"Covered for 12 weeks":first>=3?(first+1)+" weeks' notice":"Act now")+kpi("Weeks short",shortW,!shortW,"")+kpi("Peak gap",Math.round(Math.min(0,...gap))+" FTE",Math.min(...gap)>=0,"");
   const Wd=660,H=230,pl=44,pr2=10,pt=14,pb=28, all=[...sup,...dem], ticks=niceTicks(Math.min(...all)*.92,Math.max(...all)*1.03,4), t0=ticks[0], t1=ticks[ticks.length-1], y=q=>pt+(H-pt-pb)*(1-(q-t0)/(t1-t0)), slot=(Wd-pl-pr2)/12;
   let s=`<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Supply versus demand by week">`;
   ticks.forEach(t=>s+=`<line x1="${pl}" x2="${Wd-pr2}" y1="${y(t)}" y2="${y(t)}" stroke="var(--rule)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="11" font-family="JetBrains Mono, monospace" fill="var(--muted)">${t}</text>`);
   gap.forEach((g,i)=>{ if(g<0) s+=`<rect x="${pl+slot*i+slot*.15}" y="${y(dem[i])}" width="${slot*.7}" height="${y(sup[i])-y(dem[i])}" fill="var(--unfav)" opacity=".3"/>`; });
   const line=(arr,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${arr.map((q,i)=>`${pl+slot*i+slot/2},${y(q)}`).join(" ")}"/>`+arr.map((q,i)=>`<circle cx="${pl+slot*i+slot/2}" cy="${y(q)}" r="3" fill="${col}"/>`).join("");
   s+=line(sup,"var(--brand)")+line(dem,"var(--accent)");
   sold.forEach((_,i)=>s+=`<text x="${pl+slot*i+slot/2}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="${gap[i]<0?"var(--unfav)":"var(--muted)"}" font-family="Manrope, sans-serif">W${i+1}</text>`);
   $("#cap-chart").innerHTML=s+"</svg>"; };
  $$("#cap-chips .chip").forEach(b=>b.onclick=()=>{ pr=b.dataset.p; $$("#cap-chips .chip").forEach(x=>x.setAttribute("aria-pressed",x===b)); draw(); });
  bindSliders(["cap-bench","cap-att","cap-prob"],[x=>"+"+x,x=>x,x=>x+"%"],draw); }};

W.capex={title:"Capex plan: from spreadsheets to one model",html:()=>`<div class="seg" id="cx-mode" role="group" aria-label="Process view"><button type="button" data-m="before" aria-pressed="false">Before: spreadsheets</button><button type="button" data-m="after" aria-pressed="true">After: connected model</button></div><div id="cx-flow"></div><div class="sliders">${slider("cx-env","Annual capex envelope",40,120,5,80,x=>"$"+x+"M")}</div><p class="eyebrow">Select projects to approve (illustrative)</p><div class="chips" id="cx-chips"></div><div id="cx-chart"></div><div class="legend"><span><i style="background:var(--brand)"></i>Asset group A</span><span><i style="background:var(--accent)"></i>Asset group B</span><span><i style="background:var(--fav)"></i>Asset group C</span><span><i style="background:var(--unfav)"></i>Envelope</span></div>`,
 bind(){ const projects=[["Subsea tie-back (A)",0,28],["Well intervention (A)",0,12],["Topsides upgrade (B)",1,22],["Compression debottleneck (B)",1,15],["Integrity programme (C)",2,18],["Power-from-shore study (C)",2,9],["Digital twin (A)",0,6]], on=new Set([0,1,2,4,6]);
  const box=(x,y,w,t,fill,ink,stroke)=>`<rect x="${x}" y="${y}" width="${w}" height="28" rx="6" fill="${fill}" ${stroke?`stroke="${stroke}"`:""}/><text x="${x+w/2}" y="${y+18}" text-anchor="middle" font-size="11" font-weight="600" fill="${ink}" font-family="Manrope, sans-serif">${t}</text>`;
  const flow=m=>{ if(m==="before"){ const n=[["Asset A sheets",20,10],["Asset B sheets",20,56],["Asset C sheets",20,102],["Regional rollup",250,22],["Finance rework",250,90],["Plan pack",500,56]], e=[[0,3],[0,4],[1,3],[1,4],[2,3],[2,4],[3,4],[4,3],[3,5],[4,5]]; let s=`<svg viewBox="0 0 660 140" role="img" aria-label="Spreadsheet process with many handoffs">`; e.forEach(([a,b])=>s+=`<line x1="${n[a][1]+130}" y1="${n[a][2]+14}" x2="${n[b][1]}" y2="${n[b][2]+14}" stroke="var(--unfav)" stroke-dasharray="4 3"/>`); n.forEach(([t,x,y])=>s+=box(x,y,130,t,"var(--surface)","var(--ink)","var(--rule)")); return s+`</svg><p class="eyebrow">100+ spreadsheets · 50+ manual handoffs · weeks of reconciliation</p>`; }
   let s=`<svg viewBox="0 0 660 140" role="img" aria-label="One connected planning model">`; [10,56,102].forEach((y,i)=>{ s+=`<line x1="150" y1="${y+14}" x2="250" y2="70" stroke="var(--brand)" stroke-width="2"/>`+box(20,y,130,"Asset "+"ABC"[i]+" inputs","var(--brand-soft)","var(--ink)"); });
   s+=`<rect x="250" y="48" width="180" height="44" rx="8" fill="var(--brand)"/><text x="340" y="75" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--brand-ink)" font-family="Manrope, sans-serif">One connected model</text><line x1="430" y1="70" x2="500" y2="70" stroke="var(--brand)" stroke-width="2"/>`+box(500,56,140,"Plan & forecast","var(--accent)","var(--accent-ink)")+`</svg><p class="eyebrow">~40% more efficient · 3,800+ hours saved · one version of the truth</p>`; return s; };
  $$("#cx-mode button").forEach(b=>b.onclick=()=>{ $$("#cx-mode button").forEach(x=>x.setAttribute("aria-pressed",x===b)); $("#cx-flow").innerHTML=flow(b.dataset.m); });
  $("#cx-flow").innerHTML=flow("after");
  $("#cx-chips").innerHTML=projects.map((p,i)=>`<button class="chip" type="button" data-i="${i}" aria-pressed="${on.has(i)}">${p[0]} · $${p[2]}M</button>`).join("");
  const cols=["var(--brand)","var(--accent)","var(--fav)"];
  const draw=()=>{ const env=val("cx-env"), g=[0,0,0]; projects.forEach((p,i)=>{ if(on.has(i)) g[p[1]]+=p[2]; }); const tot=g[0]+g[1]+g[2];
   const Wd=660,pl=10,pr=10,max=Math.max(130,tot+10), x=q=>pl+(Wd-pl-pr)*q/max; let s=`<svg viewBox="0 0 ${Wd} 92" role="img" aria-label="Approved capex by asset group against the envelope">`, cur=0;
   g.forEach((q,i)=>{ if(q){ s+=`<rect x="${x(cur)}" y="18" width="${x(cur+q)-x(cur)}" height="34" fill="${cols[i]}"><title>Group ${"ABC"[i]}: $${q}M</title></rect>`; cur+=q; } });
   const lab=`$${tot}M ${tot>env?"· over by $"+(tot-env)+"M":"· within envelope"}`, lx=Math.min(x(tot)+6,Wd-220);
   s+=`<line x1="${x(env)}" x2="${x(env)}" y1="8" y2="62" stroke="var(--unfav)" stroke-width="2.5"/><text x="${x(env)}" y="80" text-anchor="middle" font-size="11.5" fill="var(--unfav)" font-family="JetBrains Mono, monospace">Envelope $${env}M</text><text x="${lx}" y="${tot/max>.62?12:40}" font-size="12" font-weight="700" fill="var(--ink)" font-family="JetBrains Mono, monospace">${lab}</text></svg>`;
   $("#cx-chart").innerHTML=s; };
  $$("#cx-chips .chip").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; on.has(i)?on.delete(i):on.add(i); b.setAttribute("aria-pressed",on.has(i)); draw(); });
  bindSliders(["cx-env"],[x=>"$"+x+"M"],draw); }};

W.driver={title:"Driver tree: online revenue",html:()=>`<div class="sliders">${slider("d-vis","Site visits per month",10000,500000,5000,120000,x=>x.toLocaleString("en-US"))}${slider("d-conv","Conversion rate",0.5,6,0.1,2.4,x=>x.toFixed(1)+"%")}${slider("d-aov","Average order value",10,300,5,65,x=>"$"+x)}</div><div id="d-tree"></div>`,
 bind(){ bindSliders(["d-vis","d-conv","d-aov"],[x=>x.toLocaleString("en-US"),x=>x.toFixed(1)+"%",x=>"$"+x],()=>{ const vis=val("d-vis"), cv=val("d-conv")/100, aov=val("d-aov"), orders=vis*cv, rev=orders*aov*12;
   const node=(x,y,w,l,v,main)=>`<rect x="${x}" y="${y}" width="${w}" height="48" rx="10" fill="${main?"var(--brand)":"var(--paper)"}" stroke="${main?"var(--brand)":"var(--rule)"}"/><text x="${x+w/2}" y="${y+19}" text-anchor="middle" font-size="11" fill="${main?"var(--brand-ink)":"var(--muted)"}" font-family="Manrope, sans-serif">${l}</text><text x="${x+w/2}" y="${y+38}" text-anchor="middle" font-size="14" font-weight="600" fill="${main?"var(--brand-ink)":"var(--ink)"}" font-family="JetBrains Mono, monospace">${v}</text>`;
   const ln=(x1,y1,x2,y2)=>`<path d="M${x1} ${y1} C ${x1} ${(y1+y2)/2}, ${x2} ${(y1+y2)/2}, ${x2} ${y2}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`;
   $("#d-tree").innerHTML=`<svg viewBox="0 0 660 260" role="img" aria-label="Revenue driver tree">${ln(330,58,190,100)+ln(330,58,490,100)+ln(190,148,85,190)+ln(190,148,265,190)}${node(230,10,200,"Annual revenue",money(rev),true)}${node(100,100,180,"Orders per month",Math.round(orders).toLocaleString("en-US"))}${node(410,100,160,"Average order value","$"+aov)}${node(10,190,150,"Site visits / month",vis.toLocaleString("en-US"))}${node(195,190,140,"Conversion",(cv*100).toFixed(1)+"%")}</svg><p class="eyebrow">Each +0.1 point of conversion is worth ${money(vis*0.001*aov*12)} a year.</p>`; }); }};

W.tornado={title:"Sensitivity: which assumption moves profit most?",html:()=>`<div class="sliders">${slider("tn-s","Flex each assumption by",5,30,5,10,x=>"±"+x+"%")}</div><div class="kpis" id="tn-k"></div><div id="tn-chart"></div><div class="legend"><span><i style="background:var(--unfav)"></i>Downside</span><span><i style="background:var(--fav)"></i>Upside</span></div>`,
 bind(){ const base={vol:100000,price:80,vc:50,fixed:2200000}, ebit=o=>o.vol*(o.price-o.vc)-o.fixed;
  bindSliders(["tn-s"],[x=>"±"+x+"%"],()=>{ const k=val("tn-s")/100, b=ebit(base);
   const rows=[["Volume","vol",1],["Price","price",1],["Variable cost per unit","vc",-1],["Fixed costs","fixed",-1]].map(([l,key,dir])=>({l,lo:ebit({...base,[key]:base[key]*(1-k*dir)})-b,hi:ebit({...base,[key]:base[key]*(1+k*dir)})-b})).sort((x,y)=>(y.hi-y.lo)-(x.hi-x.lo));
   $("#tn-k").innerHTML=kpi("Base operating profit",money(b),true,"100k units · $80 price · $50 variable cost · $2.2M fixed")+kpi("Biggest driver",rows[0].l,true,"Focus planning effort here")+kpi("Swing from "+rows[0].l.toLowerCase(),money(rows[0].hi-rows[0].lo),true,"");
   const Wd=660,rh=46,H=rows.length*rh+34,pl=170,pr=16,mid=pl+(Wd-pl-pr)/2,mx=Math.max(...rows.map(r=>Math.max(-r.lo,r.hi))),sc=(Wd-pl-pr)/2/mx*.72;
   let g=`<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Tornado chart of profit sensitivity">`;
   rows.forEach((r,i)=>{ const y=6+i*rh; g+=`<text x="${pl-12}" y="${y+22}" text-anchor="end" font-size="12" fill="var(--ink)" font-family="Manrope, sans-serif">${r.l}</text><rect x="${mid+r.lo*sc}" y="${y+6}" width="${-r.lo*sc}" height="26" rx="4" fill="var(--unfav)"/><rect x="${mid}" y="${y+6}" width="${r.hi*sc}" height="26" rx="4" fill="var(--fav)"/><text x="${mid+r.lo*sc-6}" y="${y+23}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">${money(r.lo)}</text><text x="${mid+r.hi*sc+6}" y="${y+23}" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">+${money(r.hi)}</text>`; });
   $("#tn-chart").innerHTML=g+`<line x1="${mid}" x2="${mid}" y1="4" y2="${H-24}" stroke="var(--ink)"/><text x="${mid}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Manrope, sans-serif">Change in operating profit vs base</text></svg>`; }); }};

W.scorecard={title:"KPI scorecard: set the amber tolerance",html:()=>`<div class="sliders">${slider("sc-t","Amber band",1,15,1,5,x=>"within "+x+"% of target")}</div><div class="tablewrap"><table id="sc"><thead><tr><th>KPI</th><th style="text-align:left">Type</th><th>Target</th><th>Actual</th><th>vs target</th><th style="text-align:left">Status</th></tr></thead><tbody></tbody></table></div><p class="eyebrow">Illustrative figures. For KPIs where lower is better, beating target means coming in below it.</p>`,
 bind(){ const K=[["Revenue ($M)","Lagging",12.0,11.7,1],["Gross margin %","Lagging",62,63.4,1],["Pipeline coverage (x)","Leading",3.0,2.6,1],["Customer churn %","Leading",1.5,1.6,-1],["Days sales outstanding","Lagging",45,52,-1],["Employee attrition %","Leading",12,11,-1]];

W.wc={title:"Cash conversion cycle: release cash",html:()=>`<div class="sliders">${slider("w-rev","Annual revenue",20,500,5,120,x=>"$"+x+"M")}${slider("w-dso","DSO (days)",20,120,1,62,x=>x)}${slider("w-dio","DIO (days)",0,120,1,45,x=>x)}${slider("w-dpo","DPO (days)",10,120,1,38,x=>x)}${slider("w-t","Target CCC reduction",0,30,1,10,x=>x+" days")}</div><div class="kpis" id="w-k"></div>`,

 bind(){ bindSliders(["m-rev","m-cogs","m-opex","m-da","m-int","m-tax"],[x=>"$"+x+"M",x=>x+"% of revenue",x=>x+"% of revenue",x=>x+"% of revenue",x=>"$"+x.toFixed(1)+"M",x=>x+"%"],()=>{ const rev=val("m-rev"), cogs=rev*val("m-cogs")/100, gp=rev-cogs, opex=rev*val("m-opex")/100, ebitda=gp-opex, da=rev*val("m-da")/100, ebit=ebitda-da, int=val("m-int"), ebt=ebit-int, tax=Math.max(0,ebt*val("m-tax")/100), ni=ebt-tax;

   $("#m-chart").innerHTML=waterfall([{label:"Revenue",value:rev,total:true},{label:"Cost of sales",value:-cogs},{label:"Opex",value:-opex},{label:"EBITDA",value:ebitda,total:true,color:"var(--accent)"},{label:"D&A",value:-da},{label:"Interest",value:-int},{label:"Tax",value:-tax},{label:"Net income",value:ni,total:true}],{fmt:x=>"$"+x.toFixed(1)+"M"}); }); }};

 bind(){ bindSliders(["be-p","be-v","be-f","be-u"],[x=>"$"+x,x=>"$"+x,x=>"$"+x+"k",x=>x+"k units"],()=>{ const p=val("be-p"), vc=val("be-v"), f=val("be-f")*1000, u=val("be-u")*1000, cm=p-vc, be=cm>0?f/cm:Infinity, profit=u*cm-f, mos=isFinite(be)?(u-be)/u:-1;
   $("#be-k").innerHTML=kpi("Contribution per unit","$"+cm,cm>0,cm>0?pct(cm/p,0)+" contribution margin":"Price below variable cost")+kpi("Break-even volume",isFinite(be)?Math.ceil(be).toLocaleString("en-US")+" units":"Never",isFinite(be)&&be<=u,"")+kpi("Profit at expected volume",(profit<0?"−":"")+money(Math.abs(profit)),profit>=0,profit>=0?"Profitable":"Loss-making")+kpi("Margin of safety",isFinite(be)?pct(mos,0):"–",mos>=0.15,mos>=0.15?"Comfortable":"Thin or negative");
   const Wd=660,H=250,pl=64,pr=14,pt=22,pb=32, xmax=Math.max(u,isFinite(be)?Math.min(be,u*3):u)*1.35, ymax=Math.max(p*xmax,f+vc*xmax), ticks=niceTicks(0,ymax,4), y1=ticks[ticks.length-1], X=q=>pl+(Wd-pl-pr)*q/xmax, Y=q=>pt+(H-pt-pb)*(1-q/y1);
   let g=`<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Cost-volume-profit chart">`;
   ticks.forEach(t=>g+=`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--rule)"/><text x="${pl-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" font-family="JetBrains Mono, monospace" fill="var(--muted)">${money(t)}</text>`);

function bindQuiz(){ let i=0, score=0; const picks=[]; const best=store.get("pva-quiz-best2",null);
  const render=()=>{ const el=$("#quiz");

      $("#q-again").onclick=()=>{ i=0; score=0; picks.length=0; render(); window.scrollTo(0,0); }; return; }
    const q=QUIZ[i];
    el.innerHTML=`<div class="qbar" aria-hidden="true">${QUIZ.map((_,k)=>`<i class="${k<i?"done":k===i?"now":""}"></i>`).join("")}</div><div class="toolbar"><span class="eyebrow">Question ${i+1} of ${QUIZ.length} · Score ${score}</span><span class="tag">${esc(q.t)}</span></div><h2 style="font-size:var(--s2)">${esc(q.q)}</h2><div class="qopts">${q.o.map((o,k)=>`<button class="qopt" type="button" data-k="${k}"><span class="qletter">${"ABCD"[k]}</span>${esc(o)}</button>`).join("")}</div><div id="q-exp" aria-live="polite"></div>`;
    $$(".qopt").forEach(b=>b.onclick=()=>{ const k=+b.dataset.k, ok=k===q.a; picks[i]=k; if(ok) score++;
      $$(".qopt").forEach(x=>{ x.disabled=true; if(+x.dataset.k===q.a) x.classList.add("right"); });
      if(!ok) b.classList.add("wrong");
      $("#q-exp").innerHTML=`<div class="callout"><strong>${ok?"Correct.":"Not quite. The answer is "+"ABCD"[q.a]+"."}</strong> ${esc(q.e)}</div><div class="btns" style="margin-top:12px"><button class="btn" id="q-next" type="button">${i===QUIZ.length-1?"See your score":"Next question →"}</button></div>`;
      $("#q-next").onclick=()=>{ i++; render(); }; $("#q-next").focus(); }); };
  render(); }

        <li><span class="when">Nov 2021 – Sep 2026</span><div><h3>Senior Consultant, Connected Planning</h3><p>Kearney Activate (formerly Cervello), Delhi. Four end-to-end Anaplan implementations across revenue planning, resource planning, project prioritisation and capex planning, as Solution Architect and Senior Model Builder. <a href="#case-studies">See the case studies →</a></p></div></li>

function bindAbout(){}

/* ================================================================
   ROUTER, THEME, SCROLL
   ================================================================ */
function route(){
  const h=(location.hash||"#home").slice(1)||"home", app=$("#app"); let section=h, bind=null, x;
  if(h==="home"){ app.innerHTML=viewHome(); bind=bindHome; section=""; }
  else if(h==="concepts"){ app.innerHTML=viewConcepts(); bind=bindConcepts; }
  else if(h==="case-studies"){ app.innerHTML=viewCases(); bind=bindCases; }
  else if(h==="templates"){ app.innerHTML=viewTemplates(); bind=bindDlButtons; }
  else if(h==="blog"){ app.innerHTML=viewBlog(); bind=bindBlog; }
  else if(h==="quiz"){ app.innerHTML=viewQuiz(); bind=bindQuiz; }
  else if(h==="interview-prep"){ app.innerHTML=viewInterview(); bind=bindInterview; }
  else if(h==="about"){ app.innerHTML=viewAbout(); bind=bindAbout; }
  else if(x=CONCEPTS.find(c=>c.id===h)){ app.innerHTML=viewConcept(x); bind=()=>bindConcept(x); section="concepts"; }
  else if(x=CASES.find(c=>c.id===h)){ app.innerHTML=viewCase(x); bind=()=>bindCase(x); section="case-studies"; }
  else if(x=POSTS.find(c=>c.id===h)){ app.innerHTML=viewPost(x); bind=bindPost; section="blog"; }
  else if(x=TEMPLATES.find(c=>c.id===h)){ app.innerHTML=viewTemplate(x); bind=()=>{ W[x.preview].bind(); bindDlButtons(); }; section="templates"; }
  else { app.innerHTML=`<div class="view wrap"><div class="pagehead"><h1>Page not found</h1><p>That page doesn't exist. <a href="#home">Go to the home page</a>.</p></div></div>`; section=""; }
  if(bind) bind();
  $$(".nav a").forEach(a=>a.getAttribute("href")==="#"+section?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  window.scrollTo(0,0); onScroll();
}
function onScroll(){ const d=document.documentElement, max=d.scrollHeight-innerHeight; $("#readbar").style.width=$(".article")&&max>0?(scrollY/max*100)+"%":"0"; $("#totop").hidden=scrollY<900; }
const isDark=()=>document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);
function themeIcon(){ const d=isDark(); $("#theme-btn").innerHTML=d?ICON.sun:ICON.moon; $("#theme-btn").setAttribute("aria-label",d?"Switch to light theme":"Switch to dark theme"); }
const savedTheme=store.get("pva-theme",null); if(savedTheme==="dark"||savedTheme==="light") document.documentElement.dataset.theme=savedTheme;
$("#theme-btn").onclick=()=>{ document.documentElement.dataset.theme=isDark()?"light":"dark"; store.set("pva-theme",document.documentElement.dataset.theme); themeIcon(); };
$("#totop").onclick=()=>window.scrollTo({top:0});
addEventListener("scroll",onScroll,{passive:true});
$("#foot-left").textContent=`© ${new Date().getFullYear()} ${AUTHOR.name} · The FP&A Compass`;
themeIcon();
addEventListener("hashchange",route);
route();
</script>
