<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>The FP&amp;A Compass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The FP&A Compass: an FP&A and Connected Planning knowledge hub by Aastha Khanna. Core concepts, case studies, downloadable Excel templates and blog.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* The FP&A Compass. Layout: sticky header, a deep-navy "board-room" hero band, then ledger-style content. Saffron is the single highlight colour; teal/red are reserved for favorable/unfavorable. */
:root{
  --paper:#F5F7FA; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#5B6678; --rule:#DCE3EC; --stripe:#EFF3F8;
  --brand:#13294B; --brand-ink:#FFFFFF; --brand-soft:#E6EDF7; --accent:#E3A62B; --accent-ink:#2B1B00; --accent-soft:#FCF1D8;
  --fav:#16786A; --unfav:#C2412D; --total:#13294B;
  --hero-bg:#0B1B33; --hero-ink:#F1F5FB; --hero-muted:#AFC0D6; --hero-rule:#22385A; --hero-card:#13284A;
  --f-display:"Sora", "Segoe UI", system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s-1:.8125rem; --s0:1rem; --s1:1.125rem; --s2:1.45rem; --s3:1.95rem; --s4:2.6rem; --s5:clamp(2.3rem,5.6vw,4rem);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0B111A; --surface:#121B28; --ink:#E7EDF5; --muted:#9AA8BA; --rule:#243244; --stripe:#172233;
  --brand:#8FB4E8; --brand-ink:#0B1626; --brand-soft:#1A2A40; --accent:#F2C14E; --accent-ink:#241700; --accent-soft:#2E2512;
  --fav:#4CC7A8; --unfav:#F28572; --total:#8FB4E8;
  --hero-bg:#08142A; --hero-ink:#F1F5FB; --hero-muted:#A7B8CE; --hero-rule:#1F3352; --hero-card:#102342; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B111A; --surface:#121B28; --ink:#E7EDF5; --muted:#9AA8BA; --rule:#243244; --stripe:#172233;
  --brand:#8FB4E8; --brand-ink:#0B1626; --brand-soft:#1A2A40; --accent:#F2C14E; --accent-ink:#241700; --accent-soft:#2E2512;
  --fav:#4CC7A8; --unfav:#F28572; --total:#8FB4E8;
  --hero-bg:#08142A; --hero-ink:#F1F5FB; --hero-muted:#A7B8CE; --hero-rule:#1F3352; --hero-card:#102342; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--s0);line-height:1.62}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--brand);text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=range]{accent-color:var(--brand);width:100%}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1}
.brand-mark{width:32px;height:32px;flex:none}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto;align-items:center}
.nav a{font-size:.9rem;font-weight:600;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px}
.nav a:hover{color:var(--ink);background:var(--stripe)}
.nav a[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;margin-left:6px;flex:none}
.iconbtn svg{width:17px;height:17px}
@media (max-width:760px){.nav{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}.nav a{white-space:nowrap}}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0;transition:width .1s linear}

main{padding-block:0 80px;min-height:60vh}
.view{display:flex;flex-direction:column;gap:56px;padding-top:40px}
.view.flush{padding-top:0}

/* Hero band */
.hero{background:var(--hero-bg);color:var(--hero-ink)}
.hero .wrap.top-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;padding-block:56px 48px}
.hero h1{font-size:var(--s5);font-weight:600;letter-spacing:-.025em}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero-copy{display:flex;flex-direction:column;gap:20px;min-width:0}
.hero .eyebrow{color:var(--hero-muted)}
.hero .lede{font-size:var(--s1);color:var(--hero-muted);max-width:52ch}
.hero .who{display:flex;align-items:center;gap:12px;font-size:.92rem;color:var(--hero-muted)}
.hero .who b{color:var(--hero-ink)}
.hero .avatar{width:44px;height:44px;font-size:1rem}
.hero-chart{background:var(--hero-card);border:1px solid var(--hero-rule);border-radius:14px;padding:18px;min-width:0}
.hero-chart header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.hero-chart h3{font-size:1.05rem;color:var(--hero-ink)}
.hero-chart svg{width:100%;height:auto;display:block}
.hero-chart .legend{color:var(--hero-muted)}
.seg{display:inline-flex;border:1px solid var(--hero-rule);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{font:600 .8rem var(--f-body);padding:5px 10px;border:0;background:transparent;color:var(--hero-muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.panel .seg{border-color:var(--rule);align-self:flex-start}
.panel .seg button{color:var(--muted)}
.panel .seg button[aria-pressed="true"]{color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hero-rule)}
.stats div{padding:20px 16px 22px;border-left:1px solid var(--hero-rule);display:flex;flex-direction:column;gap:2px}
.stats div:first-child{border-left:0;padding-left:0}
.stats .v{font-family:var(--f-display);font-size:2rem;font-weight:600;color:var(--accent)}
.stats .l{font-size:.86rem;color:var(--hero-muted)}
@media (max-width:900px){.hero .wrap.top-grid{grid-template-columns:1fr;gap:32px;padding-block:40px}.stats{grid-template-columns:repeat(2,1fr)}.stats div:nth-child(3){border-left:0;padding-left:0}.stats div:nth-child(n+3){border-top:1px solid var(--hero-rule)}}

.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;font:700 .93rem var(--f-body);padding:10px 16px;border-radius:9px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.onhero{background:transparent;border-color:var(--hero-muted);color:var(--hero-ink)}
.btn svg{width:17px;height:17px}
.btn.small{padding:6px 12px;font-size:.84rem}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--s-1);color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.wf rect{transition:y .45s ease, height .45s ease}

/* Section heads */
.sechead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.sechead h2{font-size:var(--s3)}
.sechead a{font-weight:700;font-size:.93rem;text-decoration:none}
.pagehead{display:flex;flex-direction:column;gap:12px;max-width:72ch}
.pagehead h1{font-size:var(--s4);letter-spacing:-.02em}
.pagehead p{color:var(--muted);font-size:var(--s1)}
.stack{display:flex;flex-direction:column;gap:18px}

/* Ledger index */
.ledger{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.ledger a{display:grid;grid-template-columns:4.5rem 1fr auto;gap:16px;align-items:center;padding:18px 20px;text-decoration:none;color:var(--ink);border-top:1px solid var(--rule);transition:background .15s}
.ledger a:first-child{border-top:0}
.ledger a:hover{background:var(--brand-soft)}
.ledger .code{font-family:var(--f-mono);font-size:var(--s-1);color:var(--muted)}
.ledger h3{font-size:var(--s1)}
.ledger p{color:var(--muted);font-size:.94rem}
.ledger .count{font-family:var(--f-display);font-size:1.7rem;color:var(--brand);text-align:right;line-height:1}
.ledger .count small{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
@media (max-width:560px){.ledger a{grid-template-columns:1fr auto}.ledger .code{display:none}}

/* Planning cycle */
.cycle{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:24px}
.cycle svg{width:100%;height:auto;max-width:340px;display:block}
.cycle .seg-arc{cursor:pointer;transition:opacity .15s}
.cycle .seg-arc:hover{opacity:.85}
.cycle-detail{display:flex;flex-direction:column;gap:10px;min-width:0}
.cycle-detail h3{font-size:var(--s2)}
.cycle-detail ul{margin:0;padding-left:1.2em;color:var(--muted);display:flex;flex-direction:column;gap:4px}
@media (max-width:720px){.cycle{grid-template-columns:1fr}.cycle svg{margin:0 auto}}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px;text-decoration:none;color:var(--ink);min-width:0;transition:border-color .15s, transform .15s, box-shadow .15s}
.card:hover{border-color:var(--brand);transform:translateY(-3px);box-shadow:0 10px 24px -16px var(--brand)}
.card h3{font-size:1.15rem}
.card p{color:var(--muted);font-size:.94rem}
.card .meta{display:flex;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px;font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.card .readmark{position:absolute;top:16px;right:16px;font-family:var(--f-mono);font-size:.7rem;color:var(--fav)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);border-radius:4px;padding:2px 7px;align-self:flex-start}
.result{font-family:var(--f-mono);font-size:.85rem;color:var(--fav);font-weight:500}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 .86rem var(--f-body);padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.searchbox{font:inherit;padding:9px 12px;border-radius:9px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);width:min(100%,320px)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.meter{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted)}
.meter .bar{width:160px;height:8px;border-radius:99px;background:var(--rule);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* Articles */
.article{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:48px;align-items:start}
.article-body{display:flex;flex-direction:column;gap:18px;max-width:72ch;min-width:0}
.article-body h1{font-size:var(--s4);letter-spacing:-.02em}
.article-body h2{font-size:var(--s2);margin-top:16px}
.article-body h3{font-size:var(--s1)}
.article-body ul,.article-body ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.article-body .lede{font-size:var(--s1);color:var(--muted)}
.crumbs{font-size:.86rem;color:var(--muted)}
.crumbs a{text-decoration:none}
.formula{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:8px;padding:14px 16px;font-family:var(--f-mono);font-size:.88rem;overflow-x:auto;white-space:pre;line-height:1.75}
.callout{background:var(--brand-soft);border-radius:10px;padding:14px 16px;font-size:.96rem}
.callout strong{font-family:var(--f-display)}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);display:flex;flex-direction:column;gap:14px;font-size:.92rem}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.box a{text-decoration:none}
.factlist{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.factlist dt{color:var(--muted)}.factlist dd{margin:0;font-weight:600}
.disclaimer{font-size:.84rem;color:var(--muted);border:1px dashed var(--rule);border-radius:8px;padding:10px 12px}
.markread{align-self:flex-start}
@media (max-width:920px){.article{grid-template-columns:1fr}.aside{position:static}}

.toc{max-height:60vh;overflow:auto}
.toclink{display:block;text-align:left;background:none;border:0;padding:3px 0;font:500 .86rem var(--f-body);color:var(--brand);cursor:pointer}
.toclink:hover{text-decoration:underline}
.article-body blockquote{margin:0;padding:6px 0 6px 16px;border-left:3px solid var(--rule);font-family:var(--f-display);font-style:italic;font-size:1.1rem;color:var(--muted)}
@media (max-width:920px){.toc{display:none}}
/* Interactive panels */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel h3{font-size:1.1rem}
.panel .tryit{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:2px 8px;border-radius:4px}
.panel svg{width:100%;height:auto;display:block;max-width:780px;margin:0 auto}
.sliders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 20px}
.sliders label{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--muted)}
.sliders label span{display:flex;justify-content:space-between;gap:8px}
.sliders output{font-family:var(--f-mono);color:var(--ink);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-mono);font-size:1.4rem;font-weight:500}
.kpi .l{font-size:.83rem;color:var(--muted)}
.kpi .s{font-size:.76rem;font-weight:700}
.s.good{color:var(--fav)} .s.warn{color:var(--unfav)}
.impact{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.impact div{border-top:3px solid var(--accent);padding-top:8px;display:flex;flex-direction:column}
.impact b{font-family:var(--f-display);font-size:1.8rem;font-weight:600;color:var(--brand);line-height:1.1}
.impact span{font-size:.85rem;color:var(--muted)}

/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit}
thead th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface)}
tbody tr{background:var(--surface)}
tbody tr:nth-child(even){background:var(--stripe)}
tbody td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody td:first-child,td.txt{font-family:var(--f-body)}
td.txt{text-align:left}
tr.subtotal td{font-weight:700;border-top:1.5px solid var(--ink)}
td.fav{color:var(--fav)} td.unfav{color:var(--unfav)}
.fu{display:inline-block;min-width:1.6em;text-align:center;font-size:.72rem;font-weight:700;border-radius:4px;padding:0 4px}
.fu.F{color:var(--fav);border:1px solid var(--fav)} .fu.U{color:var(--unfav);border:1px solid var(--unfav)}
.pill{display:inline-block;font:700 .72rem var(--f-body);border-radius:99px;padding:2px 9px;border:1px solid currentColor}
.pill.ok{color:var(--fav)}
.pill.bad{color:var(--unfav)}
.pill.mid{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
td input{width:6.5em;font:inherit;text-align:right;padding:3px 6px;border:1px solid var(--rule);border-radius:4px;background:var(--accent-soft);color:var(--ink)}
td input[type=checkbox]{width:auto;accent-color:var(--brand)}
td.wrapcell{white-space:normal;min-width:16rem;text-align:left;font-family:var(--f-body)}

/* Template page */
.tplhead{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
.dlcard{background:var(--hero-bg);color:var(--hero-ink);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dlcard .eyebrow{color:var(--hero-muted)}
.dlcard ul{margin:0;padding-left:1.1em;font-size:.88rem;color:var(--hero-muted);display:flex;flex-direction:column;gap:3px}
.dlcard ul b{color:var(--hero-ink)}
.dlcard .fname{font-family:var(--f-display);font-size:1.15rem;overflow-wrap:anywhere}
.toast{font-size:.86rem;color:var(--fav);min-height:1.2em}
.dlcard .toast{color:var(--accent)}
.features{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.features li{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;font-size:.9rem}
.features li::before{content:"✓";color:var(--fav);font-weight:700;margin-right:8px}
.tplhead>*{min-width:0}
@media (max-width:900px){.tplhead{grid-template-columns:minmax(0,1fr)}}

/* Quiz */
.quiz{max-width:760px;display:flex;flex-direction:column;gap:18px}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{text-align:left;font:500 .97rem var(--f-body);padding:12px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.qopt:hover:not(:disabled){border-color:var(--brand)}
.qopt.right{border:2px solid var(--fav)}
.qopt.wrong{border:2px solid var(--unfav)}
.qopt:disabled{cursor:default}
.qbar{display:flex;gap:4px}
.qbar i{flex:1;height:6px;border-radius:99px;background:var(--rule)}
.qbar i.done{background:var(--brand)} .qbar i.now{background:var(--accent)}

/* About */
.about{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:28px}
.avatar{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 2rem var(--f-display);flex:none}
.about h2{font-size:var(--s3)}
.about p{color:var(--muted)}
.skills{display:flex;flex-wrap:wrap;gap:6px}

  location:"Delhi, India",

  }
};

/* ================================================================
   CORE CONCEPTS
   ================================================================ */
const CONCEPTS = [
{id:"cost-allocation",cat:"Foundations",title:"Cost Behaviour & Allocation",
 summary:"Which costs are direct, indirect, fixed or variable, and how to assign shared costs fairly.",
 what:"<b>Direct costs</b> can be traced to a product, customer or department. <b>Indirect (shared) costs</b>, like IT, finance, rent or HR, can't, so they are allocated using a driver such as headcount, floor space or usage. <b>Activity-based costing</b> (ABC) goes further and allocates costs based on the activities that actually consume them.",
 why:"Allocations shape product and customer profitability, transfer prices and department budgets. Poor allocation makes some products look profitable when they aren't, which leads to bad pricing and investment decisions.",
 how:`<ul><li>Separate direct and indirect costs.</li><li>Choose drivers that reflect how each cost is actually consumed.</li><li>Keep the method simple enough to explain in one sentence.</li><li>Review drivers once a year as the business changes.</li><li>Report margins before and after allocations, so managers see what they control.</li></ul>`,
 formula:"Allocation rate = Shared cost pool ÷ Total driver volume\nAllocated cost = Driver volume used × Allocation rate",
 example:"IT costs of $1.2M are allocated by number of users: 600 users gives $2,000 per user, so a department with 90 users is allocated $180k. Allocating by revenue instead would charge the largest department far more, even if it uses less IT.",
 pitfalls:["Allocating by revenue because it's easy, not because it reflects usage","Holding managers accountable for costs they can't control","Allocations so complex nobody can explain them"],
 related:["contribution-margin","ebitda-margins","budgeting-approaches"]},
{id:"budgeting-approaches",cat:"Planning",title:"Budgeting Approaches",
 summary:"Top-down, bottom-up, incremental, zero-based and activity-based budgeting: what each is good for.",
 what:"There are several ways to build a budget. <b>Top-down</b> starts from leadership targets; <b>bottom-up</b> builds from each team's needs. <b>Incremental</b> adjusts last year's numbers; <b>zero-based</b> justifies every cost from scratch; <b>activity-based</b> budgets from the activities needed to deliver planned output. Most companies combine them.",
 why:"The approach shapes behaviour. Incremental budgets are fast but lock in waste; zero-based budgets find savings but take effort. Choosing the right mix for each cost type keeps the process efficient and credible.",
 how:`<div class="tablewrap"><table><thead><tr><th>Approach</th><th style="text-align:left">Best for</th><th style="text-align:left">Watch out for</th></tr></thead><tbody><tr><td>Top-down</td><td class="wrapcell">Setting ambition early in the cycle</td><td class="wrapcell">Targets that budget owners don't believe</td></tr><tr><td>Bottom-up</td><td class="wrapcell">Operational realism and ownership</td><td class="wrapcell">Padding and slow cycles</td></tr><tr><td>Incremental</td><td class="wrapcell">Stable, low-value cost lines</td><td class="wrapcell">Locking in inefficiency</td></tr><tr><td>Zero-based</td><td class="wrapcell">Discretionary spend and cost resets</td><td class="wrapcell">Effort; running it on everything every year</td></tr><tr><td>Activity-based</td><td class="wrapcell">Operations and shared services</td><td class="wrapcell">Data needs and complexity</td></tr></tbody></table></div>`,
 formula:"Incremental budget = Last year × (1 + Inflation) ± Known changes\nActivity-based budget = Planned activity volume × Cost per activity",
 example:"A company sets revenue and margin targets top-down, builds headcount bottom-up, budgets stable overheads incrementally, and runs a zero-based review of marketing and travel every second year.",
 pitfalls:["Using one approach for every cost line","Letting the budget become a negotiation","Spending more time on the process than on the decisions"],
 related:["annual-operating-plan","zero-based-budgeting","cost-allocation"]},
{id:"month-end-close",cat:"Analysis",title:"Month-End Close & Flash Reporting",
 summary:"The monthly routine that turns transactions into reliable results, and gets an early view to leaders fast.",
 what:"The <b>month-end close</b> is the process of recording, reconciling and reviewing the month's transactions so the financial statements are complete and accurate. A <b>flash report</b> is an early estimate of results, shared a few days after month-end, before the close is final. FP&A usually owns the flash, the variance analysis and the management pack that follow.",
 why:"Leaders need results quickly to act. A slow close means decisions are made on old information, and an inaccurate flash erodes trust. A well-run close calendar balances speed and accuracy.",
 how:`<ul><li>Run the close on a working-day (WD) calendar with an owner for every task.</li><li>Agree accrual cut-offs and materiality in advance.</li><li>Send the flash on WD2–3 using preliminary data and known adjustments.</li><li>Track flash-to-final accuracy every month.</li><li>Hold a short retrospective to remove one bottleneck each month.</li></ul>`,
 formula:"Flash accuracy = 1 − |Final − Flash| ÷ Final\nClose cycle time = Working days from month-end to locked results",
 example:"A team closes on WD5 and sends the management pack on WD7. By automating reconciliations and agreeing accrual cut-offs earlier, it moves the flash to WD2 and the pack to WD5 with no loss of accuracy.",
 pitfalls:["Late accruals that change results after the flash","No owner for each close task","Treating the flash as final"],
 widget:"close", related:["variance-analysis","kpi-reporting","cash-flow-forecast"]},
{id:"financial-statements",cat:"Foundations",title:"The Three Financial Statements",
 summary:"The income statement, balance sheet and cash flow statement: what each shows and how they connect.",
 what:"The <b>income statement</b> (P&L) shows revenue, costs and profit over a period. The <b>balance sheet</b> shows what the company owns (assets), owes (liabilities) and the owners' stake (equity) at a point in time. The <b>cash flow statement</b> shows how cash moved during the period across operating, investing and financing activities.",
 why:"Every FP&A output, from a budget to a board pack, is built on these three statements. Understanding how they link explains why a profitable company can run out of cash, and why a good forecast flows through all three.",
 how:`<ul><li><b>P&L:</b> Revenue − Cost of sales = Gross profit; − Operating expenses = EBITDA; − Depreciation & amortisation = EBIT; − Interest and tax = Net income.</li><li><b>Balance sheet:</b> Assets = Liabilities + Equity, always.</li><li><b>Cash flow:</b> start from net income, add back non-cash items and adjust for working capital (operating); add capex and asset sales (investing); add debt and equity flows (financing).</li><li><b>Links:</b> net income flows into retained earnings; closing cash on the cash flow statement equals cash on the balance sheet.</li></ul>`,
 formula:"Assets = Liabilities + Equity\nNet income → Retained earnings (balance sheet)\nOperating CF + Investing CF + Financing CF = Change in cash",
 example:"A company books $1M of revenue in December but the customer pays in February. The P&L shows the $1M, the balance sheet shows a $1M receivable, and the cash flow statement shows no cash received yet.",
 pitfalls:["Reading profit as cash","Forgetting that the balance sheet is a snapshot while the P&L covers a period","Ignoring non-cash items such as depreciation and accruals"],
 related:["three-statement-model","ebitda-margins","working-capital"]},
{id:"ebitda-margins",cat:"Foundations",title:"EBITDA, Margins & Profitability",
 summary:"The profit measures FP&A uses every day, and what each one tells you.",
 what:"Margins express profit as a percentage of revenue at each level of the P&L: gross margin, contribution margin, EBITDA margin, operating (EBIT) margin and net margin. <b>EBITDA</b> (earnings before interest, taxes, depreciation and amortisation) is widely used as a proxy for operating cash profit.",
 why:"Margins let you compare performance across periods, business units and competitors regardless of size. They show where profit is made or lost: in pricing and production (gross margin) or in overheads (EBITDA margin).",
 how:`<ul><li>Track margins as a trend, not a single month.</li><li>Use <b>adjusted EBITDA</b> carefully: define adjustments once and apply them consistently.</li><li>Explain margin changes with a bridge (price, volume, mix, cost).</li><li>Benchmark against peers in the same industry; a "good" margin varies widely by sector.</li></ul>`,
 formula:"Gross margin % = (Revenue − Cost of sales) ÷ Revenue\nEBITDA = Operating profit (EBIT) + Depreciation + Amortisation\nEBITDA margin % = EBITDA ÷ Revenue\nNet margin % = Net income ÷ Revenue",
 example:"Revenue $50M, cost of sales $20M, operating expenses $19M, D&A $3M. Gross margin is 60%, EBITDA is $11M (22%) and EBIT is $8M (16%).",
 pitfalls:["Treating EBITDA as cash (it ignores capex, working capital and tax)","Too many 'one-off' adjustments","Comparing margins across industries with different cost structures"],
 widget:"margins", related:["financial-statements","contribution-margin","cost-allocation"]},
{id:"contribution-margin",cat:"Foundations",title:"Contribution Margin & Break-even",
 summary:"How fixed and variable costs determine the volume a business needs to make a profit.",
 what:"Costs are either <b>variable</b> (they rise with volume, like materials and commissions) or <b>fixed</b> (they don't, like rent and salaried staff). <b>Contribution margin</b> is revenue minus variable costs: what each unit contributes towards fixed costs and then profit. <b>Break-even</b> is the volume where total contribution equals fixed costs.",
 why:"It answers everyday questions: how many units must we sell to cover a new hire? What happens to profit if price drops 5%? How risky is our cost structure? A business with high fixed costs has high <b>operating leverage</b>: profit rises fast with volume, and falls fast too.",
 how:`<ul><li>Classify each cost line as fixed, variable or semi-variable.</li><li>Calculate contribution per unit and contribution margin %.</li><li>Use break-even and margin of safety to test plans, pricing and investment decisions.</li></ul>`,
 formula:"Contribution per unit = Price − Variable cost per unit\nBreak-even units = Fixed costs ÷ Contribution per unit\nMargin of safety = (Expected sales − Break-even sales) ÷ Expected sales\nOperating leverage = Contribution ÷ Operating profit",
 example:"Price $80, variable cost $50, fixed costs $600k. Contribution is $30 a unit, so break-even is 20,000 units. At 26,000 units, profit is $180k and the margin of safety is 23%.",
 pitfalls:["Treating semi-variable costs as fully fixed","Assuming price and volume are independent","Using averages across products with very different margins"],
 widget:"breakeven", related:["ebitda-margins","price-volume-mix","scenario-analysis"]},
{id:"bookings-billings-revenue",cat:"Foundations",title:"Bookings, Billings & Revenue",
 summary:"Three numbers that sound alike but tell different stories, especially in subscription and services businesses.",
 what:"<b>Bookings</b> are the value of contracts signed in a period. <b>Billings</b> are the amounts invoiced to customers. <b>Revenue</b> is what's earned and recognised under accounting rules, for example spread evenly over a subscription term. <b>Deferred revenue</b> is billed but not yet earned; <b>unbilled revenue</b> is earned but not yet invoiced.",
 why:"Each answers a different question. Bookings show sales momentum, billings drive cash, and revenue shows earned performance. Mixing them up leads to wrong forecasts and awkward board conversations.",
 how:`<ul><li>Report all three, clearly defined, in subscription and project businesses.</li><li>Forecast revenue from the contracted backlog plus expected new bookings, using recognition patterns.</li><li>Reconcile billings to revenue through movements in deferred and unbilled revenue.</li></ul>`,
 formula:"Revenue = Billings + Opening deferred revenue − Closing deferred revenue\nBacklog (remaining performance obligation) = Contracted value not yet recognised",
 example:"A customer signs a 3-year, $360k contract in January (booking: $360k), billed annually upfront (billing: $120k). Revenue is $10k a month, so at the end of January deferred revenue is $110k.",
 pitfalls:["Calling bookings 'revenue' in presentations","Ignoring the gap between billing and cash collection","Treating multi-year deals inconsistently"],
 related:["unit-economics","working-capital","financial-statements"]},
{id:"financial-ratios",cat:"Foundations",title:"Key Financial Ratios",
 summary:"Liquidity, leverage, efficiency and return ratios that lenders, boards and analysts watch.",
 what:"Financial ratios condense the statements into comparable measures. <b>Liquidity</b> ratios show the ability to pay short-term obligations; <b>leverage</b> ratios show reliance on debt; <b>efficiency</b> ratios show how well assets are used; <b>return</b> ratios show the profit generated on capital.",
 why:"Lenders set covenants on them, boards track them and investors compare companies with them. FP&A must forecast them, not just report them, so the business never breaches a covenant by surprise.",
 how:`<ul><li>Pick the handful that matter for your business and its lenders.</li><li>Forecast ratios alongside the P&L and balance sheet.</li><li>Show headroom against covenant limits, not just the ratio itself.</li></ul>`,
 formula:"Current ratio = Current assets ÷ Current liabilities\nNet debt / EBITDA = (Debt − Cash) ÷ EBITDA\nInterest cover = EBITDA ÷ Interest expense\nROCE = EBIT ÷ (Total assets − Current liabilities)\nAsset turnover = Revenue ÷ Total assets",
 example:"Net debt of $24M and EBITDA of $10M give leverage of 2.4x against a covenant of 3.0x. A $2M EBITDA miss would push leverage to 3.0x, so the downside scenario needs a mitigation plan.",
 pitfalls:["Year-end figures that hide seasonal peaks","Covenant definitions that differ from management definitions","Tracking too many ratios"],
 related:["financial-statements","cash-flow-forecast","working-capital"]},
{id:"long-range-plan",cat:"Planning",title:"Long-Range Planning (LRP)",
 summary:"A 3–5 year financial view of the strategy, used to set direction, targets and investment priorities.",
 what:"The long-range plan translates strategic choices (markets, products, acquisitions, investments) into a multi-year financial outlook. It is less detailed than the annual budget and focuses on the big drivers: growth, margins, capital needs and funding.",
 why:"It tests whether the strategy is financially achievable before the business commits to it, and it provides the top-down targets for the first year of the annual plan.",
 how:`<ul><li>Start from a baseline: the current business with no new initiatives.</li><li>Layer strategic initiatives on top, each with its own costs, revenue and timing.</li><li>Model annually with a small set of drivers.</li><li>Run scenarios and show funding needs and key ratios for each year.</li></ul>`,
 formula:"LRP = Baseline + Σ Strategic initiatives\nCAGR = (Year-5 value ÷ Year-0 value)^(1/5) − 1",
 example:"Baseline revenue grows 6% a year. Two initiatives (a new region and a product launch) add $18M by year 5 but need $9M of investment, taking peak leverage to 2.8x EBITDA in year 2.",
 pitfalls:["'Hockey stick' plans where growth always starts next year","Too much detail too far out","No link between the LRP and the annual budget"],
 related:["annual-operating-plan","scenario-analysis","capital-budgeting"]},
{id:"forecasting-methods",cat:"Planning",title:"Forecasting Methods",
 summary:"From simple trends to driver-based models: choosing the right method for each line.",
 what:"Forecasting methods range from simple (run-rate, moving average, trend) to statistical (seasonal models, regression), driver-based (linked to operational drivers) and judgmental (input from the people closest to the business). Most good forecasts combine several.",
 why:"No single method fits every line. Stable costs suit trend methods, seasonal revenue needs seasonality, and strategic lines need drivers and judgment. Picking the right method improves accuracy and saves effort.",
 how:`<ul><li><b>Run-rate:</b> last period carried forward. Quick, but ignores trend and seasonality.</li><li><b>Moving average:</b> smooths noise, but lags turning points.</li><li><b>Trend / regression:</b> fits a line or relationship to history.</li><li><b>Seasonal:</b> applies seasonal indices to a trend.</li><li><b>Driver-based:</b> output as a function of operational drivers.</li><li>Measure accuracy by method and keep what works.</li></ul>`,
 formula:"Moving average (3) = (Mₜ + Mₜ₋₁ + Mₜ₋₂) ÷ 3\nLinear trend: Ŷ = a + b × t\nSeasonal forecast = Trend × Seasonal index\nMAPE = average of |Actual − Forecast| ÷ Actual",
 example:"For a seasonal product, a 3-month moving average under-forecasts the December peak badly. Applying seasonal indices to the trend cuts the error sharply. Try it in the calculator above.",
 pitfalls:["Using one method for everything","Over-fitting history that won't repeat","Ignoring known future events such as price changes or launches"],
 widget:"methods", related:["rolling-forecast","driver-based-planning","scenario-analysis"]},
{id:"annual-operating-plan",cat:"Planning",title:"Annual Operating Plan (AOP)",
 summary:"The company's financial commitment for the year: targets, resources and the assumptions that link them.",
 what:"The AOP (or annual budget) translates strategy into a twelve-month financial plan. It sets revenue and profit targets, allocates headcount and spend to each team, and becomes the baseline that actual results are measured against.",
 why:"It forces trade-offs to be made once, explicitly, instead of all year long. It also creates accountability: every budget owner signs up to a number.",
 how:`<ol><li><b>Top-down guidance.</b> Leadership sets growth and margin targets from the strategic plan.</li><li><b>Bottom-up build.</b> Departments build revenue drivers, headcount and non-headcount spend.</li><li><b>Gap closure.</b> FP&A reconciles the two and runs scenarios until the plan meets targets with realistic assumptions.</li><li><b>Approval & phasing.</b> The board approves; FP&A phases the annual number by month for tracking.</li></ol>`,
 formula:"Target EBITDA = Revenue plan × Target margin\nGap = Target EBITDA − Bottom-up EBITDA",
 example:"A business targets 20% EBITDA on $50M revenue ($10M). Bottom-up submissions add up to $8.6M. FP&A closes the $1.4M gap with a hiring-timing shift ($0.6M), vendor consolidation ($0.5M) and a renewal price increase ($0.3M).",
 pitfalls:["Treating the budget as a negotiation, which pads every line","Phasing evenly by month when the business is seasonal","Locking assumptions that nobody revisits when conditions change"],
 widget:"aop", related:["long-range-plan","zero-based-budgeting","driver-based-planning"]},
{id:"rolling-forecast",cat:"Planning",title:"Rolling Forecasts",
 summary:"A forecast that always looks a fixed distance ahead, usually 12 to 18 months, updated monthly or quarterly.",
 what:"Instead of forecasting to a fiscal year-end that gets closer every month, a rolling forecast adds a new period each time one closes. The horizon stays constant.",
 why:"Year-end forecasts go blind in Q4. A rolling view keeps the next twelve months visible, makes hiring and investment decisions better informed, and shrinks the annual budget exercise.",
 how:`<ul><li>Forecast at the level of <b>drivers</b> (volume, price, headcount), not every GL account.</li><li>Use more detail near-term (monthly) and less far out (quarterly).</li><li>Track forecast accuracy and bias every cycle.</li><li>Keep the AOP as the fixed target; the rolling forecast is your best estimate.</li></ul>`,
 formula:"Forecast accuracy = 1 − |Actual − Forecast| ÷ Actual\nBias = Σ(Forecast − Actual) ÷ Σ Actual",
 example:"In November, a 12-month rolling forecast covers December through next November. When December closes, the following December is added.",
 pitfalls:["Rebuilding every line from scratch each month: forecast fatigue sets in fast","Confusing the forecast (what we expect) with the target (what we want)","Never measuring accuracy, so the forecast never improves"],
 widget:"rf", related:["forecasting-methods","annual-operating-plan","driver-based-planning"]},
{id:"driver-based-planning",cat:"Planning",title:"Driver-Based Planning",
 summary:"Model the operational levers that cause financial results, then let the numbers follow.",
 what:"A driver-based plan expresses revenue and costs as functions of a few business drivers: volume, price, conversion rate, headcount, productivity. Change a driver and the P&L updates.",
 why:"Leaders think in drivers, not GL codes. Driver models make scenarios fast, forecasts explainable, and conversations focused on what can actually be changed.",
 how:`<ol><li>Build a <b>driver tree</b> from the outcome down (Revenue → Orders × Average order value → Visits × Conversion …).</li><li>Keep only drivers that are measurable, controllable or highly predictive.</li><li>Agree owners and data sources for each driver.</li><li>Hard-code nothing in the forecast; link every output to an input.</li></ol>`,
 formula:"Revenue = Orders × Average order value\nOrders = Visits × Conversion %\nPeople cost = Average FTE × Loaded cost per FTE",
 example:"An online retailer forecasts revenue from site visits, conversion and average order value. A 0.2-point gain in conversion shows its revenue impact instantly, so marketing can see which lever is worth funding.",
 pitfalls:["Too many drivers: the model becomes as complex as the ledger","Drivers nobody owns or can measure","Ignoring relationships between drivers (price changes affect volume)"],
 widget:"driver", related:["rolling-forecast","forecasting-methods","scenario-analysis"]},
{id:"variance-analysis",cat:"Analysis",title:"Budget vs Actual Variance Analysis",
 summary:"Explain the gap between plan and results, then say what to do about it.",
 what:"Variance analysis compares actuals to budget, forecast or prior year, quantifies each difference and explains its cause. It is the core of monthly management reporting.",
 why:"A variance that is explained and acted on is information. One that's only reported is noise.",
 how:`<ul><li>Set a <b>materiality threshold</b> (e.g. ±5% and ±$50k) and explain only what breaches it.</li><li>Label each variance <b>Favorable (F)</b> or <b>Unfavorable (U)</b>: revenue above plan is F, cost above plan is U.</li><li>Separate <b>timing</b> (will reverse) from <b>permanent</b> variances.</li><li>Write commentary as cause → impact → action → forecast implication.</li></ul>`,
 formula:"Variance = Actual − Budget\nVariance % = Variance ÷ |Budget|\nRevenue: positive = F   Cost: positive = U",
 example:"Marketing spend is $120k over budget (U). Cause: a campaign pulled forward from Q1. Timing variance; full-year forecast unchanged.",
 pitfalls:["Commentary that restates the number (\"Travel was higher than budget\")","Explaining every line instead of the material ones","No link from variance to the updated forecast"],
 widget:"bva", related:["price-volume-mix","kpi-reporting","rolling-forecast"]},
{id:"price-volume-mix",cat:"Analysis",title:"Price-Volume-Mix (PVM) Analysis",
 summary:"Split a revenue or margin variance into price, volume and mix effects.",
 what:"PVM decomposes the change in revenue or gross margin into three effects: selling at different prices, selling more or fewer units, and selling a different combination of products.",
 why:"\"Revenue was up 5%\" hides a lot. Revenue up on price while volume falls is a very different story from revenue up on volume with price erosion.",
 how:`<p>Calculate per product, then sum. B = budget, A = actual:</p>`,
 formula:"Price effect  = (Actual price − Budget price) × Actual qty\nVolume effect = (Σ Actual qty − Σ Budget qty) × Budget mix % × Budget price\nMix effect    = (Actual mix % − Budget mix %) × Σ Actual qty × Budget price\nPrice + Volume + Mix = Actual revenue − Budget revenue",
 example:"Revenue beat budget by $230k. PVM shows price +$180k, volume +$150k but mix −$100k: customers shifted to the cheaper range. The headline beat masks a margin problem.",
 pitfalls:["Changing the calculation order between periods","Running PVM on revenue only when margin is the real question","Too many SKUs: group into product families first"],
 widget:"pvm", related:["variance-analysis","unit-economics"]},
{id:"three-statement-model",cat:"Modeling",title:"Three-Statement Modeling",
 summary:"A linked income statement, balance sheet and cash flow that always balances.",
 what:"A three-statement model connects the P&L, balance sheet and cash flow so every assumption flows through to cash. It is the backbone of long-range plans, fundraising and M&A.",
 why:"Profit is not cash. Only a linked model shows how growth consumes working capital and when funding is needed.",
 how:`<ol><li>Build the <b>income statement</b> from drivers.</li><li>Build schedules: working capital, fixed assets, debt, equity.</li><li>Build the <b>balance sheet</b> from opening balances plus movements.</li><li>Derive the <b>cash flow statement</b> (indirect method).</li><li>Add a balance check row.</li></ol>`,
 formula:"Closing cash = Opening cash + CFO + CFI + CFF\nCFO = Net income + D&A − ΔNet working capital\nCheck: Assets − Liabilities − Equity = 0",
 example:"A business growing 40% with 60 days of receivables needs an extra $3.3M of working capital on $20M of new revenue, even while profitable.",
 pitfalls:["Hard-coded plugs to force the balance","Unmanaged circular references on interest","Mixing inputs, calculations and outputs on one sheet"],
 related:["working-capital","cash-flow-forecast","scenario-analysis"]},
{id:"scenario-analysis",cat:"Modeling",title:"Scenario & Sensitivity Analysis",
 summary:"Show leadership a range of outcomes and which assumptions move the answer most.",
 what:"Sensitivity analysis flexes one assumption at a time. Scenario analysis changes several together to describe a coherent alternative future (base, upside, downside).",
 why:"Single-point forecasts are always wrong. A range with triggers lets leaders pre-agree actions.",
 how:`<ul><li>Find the 3–5 assumptions with the biggest impact using a <b>tornado chart</b>.</li><li>Build scenarios around a story, not arbitrary ±10%.</li><li>Pair each downside with a <b>trigger</b> and a pre-agreed response.</li><li>Use one scenario switch to drive the whole model.</li></ul>`,
 formula:"Sensitivity = Δ Output ÷ Δ Input\nExpected value = Σ (Scenario outcome × Probability)",
 example:"Base EBITDA $9.0M; a downside with 15% lower volume and 2% price erosion gives $5.8M. Volume drives 70% of the swing, so the business focuses on pipeline coverage.",
 pitfalls:["Upside/downside that are just base ± a flat %","Scenarios with no actions attached","Too many scenarios to remember"],
 widget:"tornado", related:["driver-based-planning","forecasting-methods","three-statement-model"]},
{id:"capital-budgeting",cat:"Modeling",title:"Capex Planning & Investment Appraisal",
 summary:"Decide which projects to fund using NPV, IRR and payback, then track them through delivery.",
 what:"Capex planning covers the full lifecycle: idea intake, business case, prioritisation, approval, phasing of spend, and tracking actuals against the approved budget. Investment appraisal evaluates each project by discounting its future cash flows.",
 why:"Capital is scarce. A consistent method lets leadership rank projects fairly, and a single shared capex plan stops spend from being tracked in dozens of disconnected spreadsheets.",
 how:`<ul><li>Forecast incremental cash flows only.</li><li>Discount at WACC (plus a risk premium where appropriate).</li><li>Rank projects by NPV, IRR and profitability index against the capital envelope.</li><li>Phase approved spend by month and asset; track forecast vs actual.</li></ul>`,
 formula:"NPV = Σ CFₜ ÷ (1 + r)ᵗ − Initial investment\nIRR = r where NPV = 0\nProfitability index = 1 + NPV ÷ Investment",
 example:"A $2M automation project saves $650k a year for 5 years. At 10% WACC, NPV = $464k, IRR ≈ 18.6%, payback ≈ 3.1 years.",
 pitfalls:["Including sunk costs","Optimistic benefits with no owner","No post-investment review"],
 widget:"npv", related:["long-range-plan","three-statement-model","scenario-analysis"]},
{id:"unit-economics",cat:"Metrics",title:"Unit Economics & SaaS Metrics",
 summary:"Measure whether each customer or unit creates value before you scale it.",
 what:"Unit economics look at revenue and cost per unit. In SaaS the core set is ARR, net revenue retention, CAC, LTV, CAC payback and the Rule of 40.",
 why:"Growth that loses money on every unit just loses money faster. Boards judge businesses on these ratios.",
 how:`<ul><li>Define each metric once and publish it.</li><li>Use <b>gross-margin-adjusted</b> numbers for LTV and payback.</li><li>Segment by channel and customer size.</li></ul>`,
 formula:"CAC = S&M spend ÷ New customers\nLTV = (ARPA × GM %) ÷ Churn rate\nCAC payback = CAC ÷ (Monthly ARPA × GM %)\nNRR = (Start ARR + Expansion − Contraction − Churn) ÷ Start ARR\nRule of 40 = Growth % + EBITDA margin %",
 example:"ARPA $1,200/month, 78% GM, 1.5% monthly churn, CAC $14,000 → LTV $62,400, LTV:CAC 4.5x, payback 15 months.",
 pitfalls:["Excluding salaries from CAC","LTV on revenue instead of margin","Mixing monthly and annual churn"],
 widget:"saas", related:["driver-based-planning","kpi-reporting"]},
{id:"working-capital",cat:"Cash",title:"Working Capital & Cash Conversion Cycle",
 summary:"How long cash is tied up between paying suppliers and collecting from customers.",
 what:"Net working capital is receivables plus inventory minus payables. The cash conversion cycle (CCC) measures it in days.",
 why:"Every day of CCC is cash the business has to fund. Reducing it is often the cheapest financing available.",
 how:`<ul><li>Track DSO, DIO and DPO monthly by segment.</li><li>Find the drivers: billing timing, terms, disputes, safety stock.</li><li>Value each improvement in cash before you chase it.</li></ul>`,
 formula:"DSO = Receivables ÷ Revenue × 365\nDIO = Inventory ÷ COGS × 365\nDPO = Payables ÷ COGS × 365\nCCC = DSO + DIO − DPO",
 example:"Revenue $120M; DSO falls from 62 to 52 days. Cash released ≈ 10 × 120M ÷ 365 = $3.3M, one time.",
 pitfalls:["Stretching payables until suppliers raise prices","Year-end balances only","Forgetting the benefit is one-off"],
 widget:"wc", related:["cash-flow-forecast","three-statement-model"]},
{id:"cash-flow-forecast",cat:"Cash",title:"13-Week Cash Flow Forecast",
 summary:"A weekly, receipts-and-disbursements view of liquidity for the next quarter.",
 what:"The 13-week cash flow forecast is a direct-method forecast of cash in and cash out, by week.",
 why:"Monthly forecasts can't see a payroll week that collides with a tax payment. A weekly view shows the true low point.",
 how:`<ol><li>Start from actual bank balances.</li><li>Forecast receipts from AR and billings.</li><li>Forecast payments from payroll, AP runs, tax, debt and capex.</li><li>Track forecast vs actual weekly.</li></ol>`,
 formula:"Closing cash = Opening cash + Receipts − Disbursements\nHeadroom = Closing cash + Undrawn facility − Minimum cash",
 example:"Cash dips below the minimum in week 7 when quarterly tax and a capex payment land together. Moving the capex two weeks solves it.",
 pitfalls:["Building from accruals instead of cash timing","No variance tracking","Forgetting tax, loans and dividends"],
 widget:"cash", related:["working-capital","three-statement-model"]},
{id:"headcount-planning",cat:"Planning",title:"Headcount & Workforce Planning",
 summary:"People are usually 50–70% of cost. Plan them by position, start date and fully loaded cost.",
 what:"Workforce planning tracks employees, open roles and planned hires with salary, burden and start dates to forecast people cost.",
 why:"Hiring timing is the biggest source of opex variance, and this year's hires set next year's cost base.",
 how:`<ul><li>Plan at position level with a status: filled, open, planned.</li><li>Apply a <b>burden rate</b> for benefits and taxes.</li><li>Model start-date slippage and attrition explicitly.</li></ul>`,
 formula:"Fully loaded cost = Base salary × (1 + Burden %)\nIn-year cost = Loaded cost × Months employed ÷ 12",
 example:"A $120k engineer with 25% burden costs $150k loaded. Starting in month 7, in-year cost is $75k; next year's run-rate is double.",
 pitfalls:["Ignoring annualisation","No recruiting lag","Contractors tracked outside the plan"],
 widget:"hc", related:["annual-operating-plan","driver-based-planning"]},
{id:"kpi-reporting",cat:"Analysis",title:"KPI Design & Management Reporting",
 summary:"A short set of well-defined metrics, presented so the reader sees what changed and why.",
 what:"Management reporting is the monthly or weekly pack that tells leadership how the business is performing.",
 why:"A focused pack with leading indicators gets decisions made; a 60-page pack gets skimmed.",
 how:`<ul><li>Balance <b>leading</b> and <b>lagging</b> indicators.</li><li>Every KPI has an owner, definition, target and source.</li><li>One headline per page, then the evidence.</li><li>Show trend, not just the month.</li></ul>`,
 formula:"Good KPI = Measurable + Controllable + Predictive + Owned",
 example:"An exec pack shrinks from 42 slides to 8: summary, P&L bridge, KPI scorecard, cash, forecast change and three decisions needed.",
 pitfalls:["Vanity metrics","Different definitions in different decks","Reporting without a \"so what\""],
 widget:"scorecard", related:["variance-analysis","month-end-close","business-partnering"]},
{id:"zero-based-budgeting",cat:"Planning",title:"Zero-Based Budgeting (ZBB)",
 summary:"Build each cost from zero and justify it, instead of last year plus inflation.",
 what:"ZBB asks every cost owner to justify each activity from scratch, grouped into cost packages with a clear owner.",
 why:"Incremental budgets lock in historical inefficiency. ZBB typically finds 10–25% savings in discretionary spend.",
 how:`<ol><li>Build a spend cube: category × cost center × vendor.</li><li>Assign package owners across the company.</li><li>Set policies and benchmarks.</li><li>Track savings monthly.</li></ol>`,
 formula:"Budget = Activity level × Should-cost\nSavings = Baseline − ZBB budget",
