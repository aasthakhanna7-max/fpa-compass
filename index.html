{id:"anaplan-implementation-lessons",date:"2026-11-12",tag:"Connected Planning",title:"What four Anaplan implementations taught me about FP&A",
 dek:"The technology is rarely the hard part. Decisions, data, design discipline and adoption are. Seven lessons from revenue, resource, portfolio and capex planning projects.",
 body:`<p>Over the last five years I have worked on four end-to-end Anaplan implementations: revenue planning and a new bill-rate framework for a consulting firm of more than 1,000 people, a supply-and-demand resource planning solution for the same firm, a prioritisation tool for a portfolio of 1,200+ operations and maintenance projects at an energy major, and connected capex planning across three offshore asset groups for another.</p>
<p>The four projects had different users, data and goals. But when I look back at what made each one succeed, or nearly derailed it, the same lessons keep showing up. Almost none of them are about Anaplan features. They are about how finance teams plan, and how a planning tool earns trust.</p>

<h2>1. Start with the decision, not the spreadsheet</h2>
<p>Every project begins with someone showing you a spreadsheet and asking for it to be "moved into Anaplan". It is tempting to say yes. The spreadsheet is concrete, the users know it, and replicating it feels low-risk.</p>
<p>It is usually the wrong starting point. A spreadsheet captures how a team works around its constraints today, including the workarounds, manual overrides and reconciliations that exist only because the data lives in different places. Rebuild it line by line and you inherit all of that.</p>
<p>The better question is: <b>what decision does this plan support, who makes it, and how often?</b> On the revenue planning project, the real question leadership cared about was not "what is our revenue forecast?" but "where is sales forecasting revenue that we haven't staffed, and where are we staffed for revenue that isn't coming?" That one sentence shaped the whole design: two forecasts side by side, a variance, and a threshold that flags the opportunities worth a conversation.</p>
<div class="callout"><strong>Try this:</strong> before any design workshop, write down the three decisions the solution must support, and the person who makes each one. If you can't, you are not ready to design.</div>

<h2>2. Requirements are user stories, not wish lists</h2>
<p>Discovery workshops generate long lists of requests. Left as a list, they are impossible to prioritise because every item sounds equally important. Turning each one into a user story forces clarity about who needs it and why.</p>
<div class="tablewrap"><table><thead><tr><th>Workshop note</th><th style="text-align:left">User story</th></tr></thead><tbody>
<tr><td>"Need to see shortfalls"</td><td class="txt">As a staffing coordinator, I need to see FTE shortfalls by role and region for the next 12 weeks so that I can redeploy bench capacity before I hire contractors.</td></tr>
<tr><td>"Rates should update"</td><td class="txt">As a finance lead, I need to update next year's bill rates by role, region and practice in one place so that every downstream revenue model uses the same rates.</td></tr>
<tr><td>"Track capex"</td><td class="txt">As an asset finance manager, I need to compare forecast and actual capex by project each month so that I can explain slippage in the quarterly forecast.</td></tr>
</tbody></table></div>
<p>On the project prioritisation engagement we documented more than 30 requirements this way. That backlog became the basis for sprint planning, effort estimates and, later, the UAT scripts. Each story's acceptance criteria turned directly into test cases.</p>

<h2>3. Master data decides your timeline</h2>
<p>If I had to pick the single biggest source of delay across projects, it would be master data: the lists of roles, regions, practices, cost centres, assets and projects that every module depends on. When nobody owns these lists, the model inherits the mess. You find duplicates, inconsistent naming between systems, and hierarchies that change mid-build.</p>
<p>The fix is organisational as much as technical:</p>
<ul><li><b>Name an owner for every list</b> before build starts. That person approves additions and changes.</li><li><b>Load master data once, through a Data Hub</b>, and distribute it to spoke models. Don't let each model maintain its own version.</li><li><b>Agree the hierarchy early.</b> Changing a hierarchy after modules are built ripples through every formula and dashboard.</li><li><b>Budget time for data cleansing.</b> On the rate framework rollout, data cleansing and model restructuring were a planned workstream, not an afterthought, and that is why the new rate structure went live without disrupting the planning cycle.</li></ul>

<h2>4. Design for size and speed from day one</h2>
<p>Anaplan multiplies cells by every dimension a line item uses. A line item dimensioned by 1,200 employees, 400 projects, 36 months and 3 versions holds more than 51 million cells, and most of them will be empty. Do that across a few dozen line items and you have a large, slow model.</p>
<p>On one revenue planning model we reduced size by about 25% from roughly 65 GB through targeted module and dimension optimisation. It worked, but it is far cheaper to be deliberate up front:</p>
<ul><li>Give each line item only the dimensions it needs. Use subsidiary views where a calculation needs fewer dimensions than its module.</li><li>Turn off summaries nobody uses, and use time ranges for long horizons.</li><li>Prefer flat, list-based modules over sparse multi-dimensional ones for transactional data.</li><li>Follow DISCO (Data, Input, System, Calculation, Output) so data loads, user inputs and calculations don't share modules.</li></ul>

<h2>5. Build the reconciliation, not just the forecast</h2>
<p>Finance teams rarely lack forecasts. They usually have too many, each built by a different team for a different purpose, and none of them agree. The most valuable thing a connected plan can do is put those forecasts side by side and make the differences visible.</p>
<p>The revenue variance report we built compared Salesforce CRM forecasts (top-down, entered by sales at the deal level) with staffing-based projections (bottom-up: headcount × staffed hours × bill rates). Automated flags beyond a threshold highlighted two kinds of risk before month-end:</p>
<ul><li><b>Under-forecast:</b> sales expects revenue but nobody is staffed. Either the deal is at risk or staffing hasn't caught up.</li><li><b>Over-forecast:</b> people are staffed beyond what the deal is worth. That is a likely write-off.</li></ul>
<p>That report surfaced more than $4M of opportunity revenue variance, and forecast accuracy improved by about 18%. Not because the model was cleverer than the old spreadsheets, but because the gap between two views became the agenda for a monthly conversation.</p>

<h2>6. Automate the workflow, not just the maths</h2>
<p>Calculations are rarely where a planning process stalls. Handoffs are. On the capex project, the old process had more than 50 data handoffs between asset teams, regional finance and the central planning team, spread across 100+ spreadsheets. Each handoff was a chance for delay, version confusion and error.</p>
<p>Replacing that with one connected model saved more than 3,800 hours across the operating plan and quarterly forecasts and improved process efficiency by about 40%. On the prioritisation project, workflows that turned approved ideas into funded projects and allocated total cost across the project timeline cut approval cycle time by about 30%.</p>
<p>When you scope a solution, map the process, count the handoffs, and ask which ones the model can remove.</p>

<h2>7. UAT and hypercare are where adoption is won</h2>
<p>A solution can be technically perfect and still fail if users don't trust it. Trust is built in the last few weeks of a project and the first few after go-live.</p>
<ul><li><b>Write UAT scripts from acceptance criteria.</b> We wrote 20+ scripts for one release and supported UAT for 20+ business solutions on another. Clear scripts make testing faster and protect existing functionality in later releases.</li><li><b>Record short walkthrough videos.</b> Ten two-minute videos get watched; a 60-page manual does not.</li><li><b>Staff hypercare properly.</b> On the capex rollout we resolved 50+ technical, access and data mapping issues after go-live. Fixing each one fast told users the model was safe to rely on.</li><li><b>Train for handover.</b> Documentation and training are deliverables. The client team must be able to run and extend the model after you leave.</li></ul>

<h2>A checklist for your next implementation</h2>
<div class="tablewrap"><table><thead><tr><th>Phase</th><th style="text-align:left">Ask yourself</th></tr></thead><tbody>
<tr><td>Discovery</td><td class="txt">Can I name the three decisions this supports and who makes them?</td></tr>
<tr><td>Requirements</td><td class="txt">Is every request written as a user story with acceptance criteria?</td></tr>
<tr><td>Data</td><td class="txt">Does every list have an owner? Is the Data Hub the single source?</td></tr>
<tr><td>Design</td><td class="txt">Have I checked dimensionality and expected size for the largest modules?</td></tr>
<tr><td>Build</td><td class="txt">Does the model reconcile competing views, not just produce one?</td></tr>
<tr><td>Process</td><td class="txt">Which handoffs does this remove? Have we counted them?</td></tr>
<tr><td>Go-live</td><td class="txt">Are UAT scripts, videos, hypercare cover and documentation ready?</td></tr>
</tbody></table></div>
<p>Connected Planning platforms are powerful, but the outcome depends on the same fundamentals as any FP&A project: clear decisions, clean data, simple and auditable logic, and people who trust the numbers.</p>`},

{id:"variance-commentary",date:"2026-10-28",tag:"Reporting",title:"Why nobody reads your variance commentary (and how to fix it)",
 dek:"Most commentary restates the table. Here is a practical system for writing variance explanations leaders actually act on: structure, materiality, timing vs permanent, and a monthly process to make it stick.",
 body:`<p>Open almost any monthly management pack and you will find commentary like this:</p>
<blockquote>"Travel expenses were $42k over budget due to higher travel costs."</blockquote>
<p>It's accurate. It's also useless. The reader can already see from the table that travel is $42k over. The sentence adds nothing: no cause, no consequence, no hint about what happens next.</p>
<p>Leaders read variance commentary to answer one question: <b>do I need to do anything?</b> If your commentary doesn't answer that quickly, it gets skipped, and over time the whole pack gets skimmed. This post sets out a system for writing commentary that gets read.</p>

<h2>What good commentary does</h2>
<p>Good variance commentary does four jobs:</p>
<ol><li>It explains the <b>business cause</b>, not the accounting symptom.</li><li>It quantifies the <b>impact</b> and labels it favorable or unfavorable.</li><li>It says whether the variance is <b>timing</b> (it will reverse) or <b>permanent</b> (it won't).</li><li>It states the <b>implication</b>: what changes in the forecast, and whether a decision is needed.</li></ol>
<p>I use these four as a fixed structure for every material line: <b>Cause → Impact → Type → Implication</b>.</p>

<h2>Before and after</h2>
<p>Here's how the structure changes four typical lines:</p>
<div class="tablewrap"><table><thead><tr><th>Line</th><th style="text-align:left">Before</th><th style="text-align:left">After</th></tr></thead><tbody>
<tr><td>Travel</td><td class="wrapcell">$42k over budget due to higher travel.</td><td class="wrapcell">$42k U. Sales kickoff moved from March to January. Timing: Q1 forecast reduced by $42k, full year unchanged. No action.</td></tr>
<tr><td>Revenue</td><td class="wrapcell">Revenue $310k below budget.</td><td class="wrapcell">$310k U. Two enterprise renewals slipped to next month after procurement delays; both are signed-in-principle. Timing. Full-year forecast unchanged; watch item.</td></tr>
<tr><td>Contractors</td><td class="wrapcell">Contractor costs higher than expected.</td><td class="wrapcell">$95k U. Three contractors are covering open engineering roles that are now 10 weeks behind plan. Permanent while roles stay open: full-year forecast +$180k. Decision: approve recruiter fee to accelerate hiring.</td></tr>
<tr><td>Software</td><td class="wrapcell">Software under budget.</td><td class="wrapcell">$60k F. Licence true-up negotiated down after removing 120 unused seats. Permanent: full-year forecast −$240k. No action.</td></tr>
</tbody></table></div>
<p>Notice what the "after" versions give the reader: the reason, whether to worry, and what happens to the full-year number. A CFO can read the right-hand column and walk into an exec meeting prepared.</p>

<h2>Explain less, but better</h2>
<p>A common reason commentary is weak is that analysts are asked to explain everything. Forty variances, half-explained, are worse than eight explained well. Set a <b>materiality threshold</b> and stick to it.</p>
<p>A practical rule uses both a percentage and an absolute amount, so you don't chase large percentages on tiny lines or small percentages on huge ones:</p>
<div class="formula">Explain if  |Variance| ≥ $50k  AND  |Variance %| ≥ 5%
(Adjust thresholds to the size of the business and the line.)</div>
<p>The <a href="#tpl-budget-vs-actual">Budget vs Actual template</a> on this site applies exactly this logic: any line that breaches both thresholds shows an "Explain" flag, so the analyst's attention goes straight to what matters.</p>

<h2>Timing vs permanent: the most useful label you're not using</h2>
<p>The single most valuable piece of information in a variance explanation is whether it will reverse. A $200k unfavorable variance that's pure timing is a non-event for the year. A $50k unfavorable variance that's permanent and recurring is a $600k problem.</p>
<ul><li><b>Timing variances</b> come from things moving between periods: invoices booked early or late, a campaign pulled forward, a hire starting a month later. They reverse.</li><li><b>Permanent variances</b> come from real changes in price, volume, rates or decisions. They don't reverse, and they often recur.</li></ul>
<p>Labelling every material line as one or the other, and showing the full-year impact of permanent ones, connects your monthly reporting to the forecast. That link is what turns reporting into planning.</p>

<h2>Lead with the headline</h2>
<p>Before any line-by-line commentary, write a two- or three-sentence summary of the month. It should be the only thing a busy executive needs to read.</p>
<div class="callout"><strong>Example headline:</strong> EBITDA was $0.4M ahead of budget in October, entirely due to timing (marketing and hiring). Revenue was $0.3M behind on two slipped renewals that are expected next month. The full-year EBITDA forecast is unchanged at $9.2M; one decision is needed on contractor costs.</div>
<p>If the headline is clear, readers trust the detail. If it's missing, they go hunting through tables and draw their own conclusions.</p>

<h2>Get the cause from the owner</h2>
<p>FP&A analysts often spend hours drilling through the general ledger to guess why a number moved. It is almost always faster, and more accurate, to ask the budget owner. A five-minute call with the marketing lead tells you the campaign moved; an hour of GL drill-down tells you which invoice moved but not why.</p>
<p>Build this into the close calendar. When the preliminary P&L is available, send each budget owner their material variances with a short form: cause, timing or permanent, full-year impact. FP&A then edits and consolidates rather than writing from scratch.</p>

<h2>Write for the reader you have</h2>
<p>The same variance needs different commentary for different audiences:</p>
<ul><li><b>Board or executive committee:</b> the headline, the three to five variances that change the full-year view, and decisions needed.</li><li><b>Function leaders:</b> their lines in more detail, with operational context and actions.</li><li><b>Finance team:</b> full detail, including accounting adjustments and reclassifications.</li></ul>
<p>One version for everyone usually means too much detail for executives and too little for the people running the budget.</p>

<h2>Use automation for the "what", people for the "why"</h2>
<p>Planning tools and even simple spreadsheets can now calculate variances, apply materiality flags and draft a first sentence ("Travel is $42k unfavorable, 18% above budget"). AI tools can go further and summarise trends. Use them. They free up time.</p>
<p>But the cause, the timing call and the implication still need someone who knows the business. On a revenue planning project I worked on, automated flags identified which opportunities had a gap between CRM and staffing forecasts above a threshold. The flags told leadership <i>where</i> to look. The conversation with the account lead told them <i>why</i>, and what to do.</p>

<h2>A monthly process that makes it stick</h2>
<div class="tablewrap"><table><thead><tr><th>Day</th><th style="text-align:left">Step</th></tr></thead><tbody>
<tr><td>WD3</td><td class="txt">Preliminary P&L ready. FP&A runs variance report with materiality flags.</td></tr>
<tr><td>WD3</td><td class="txt">Flagged variances sent to budget owners with the four-part form.</td></tr>
<tr><td>WD4</td><td class="txt">Owners return cause, type and full-year impact. FP&A follows up by phone where needed.</td></tr>
<tr><td>WD4</td><td class="txt">FP&A updates the rolling forecast for permanent variances.</td></tr>
<tr><td>WD5</td><td class="txt">Headline and commentary written; pack reviewed by finance lead.</td></tr>
<tr><td>WD6</td><td class="txt">Pack distributed; decisions logged and tracked to next month.</td></tr>
</tbody></table></div>

<h2>Beyond budget: comparing against forecast and prior year</h2>
<p>Most packs compare actuals with budget. By mid-year, that comparison is often less useful than it looks, because the budget was set months ago on assumptions that have since changed. Two other comparisons add value:</p>
<ul><li><b>Actual vs latest forecast</b> tells you how well the business predicted this month. Large variances here point to forecasting problems, not just performance problems.</li><li><b>Actual vs prior year</b> shows underlying growth and trend, free of budget assumptions.</li></ul>
<p>A strong pack leads with one primary comparison (usually budget or forecast, agreed with the CFO) and uses the others for context. Showing all three for every line just triples the noise.</p>

<h2>Common commentary traps</h2>
<div class="tablewrap"><table><thead><tr><th>Trap</th><th style="text-align:left">Example</th><th style="text-align:left">Better</th></tr></thead><tbody>
<tr><td>Restating the number</td><td class="wrapcell">"Salaries are $80k over budget."</td><td class="wrapcell">State the cause: "Two senior hires started a month early."</td></tr>
<tr><td>Accounting cause only</td><td class="wrapcell">"Accrual reversal from prior month."</td><td class="wrapcell">Explain the business event behind it, then the accounting.</td></tr>
<tr><td>Vague words</td><td class="wrapcell">"Various small items."</td><td class="wrapcell">Name the top two, or omit if immaterial.</td></tr>
<tr><td>No forward view</td><td class="wrapcell">"Revenue down on lower volume."</td><td class="wrapcell">Add whether it continues and the full-year effect.</td></tr>
<tr><td>Hedging</td><td class="wrapcell">"May potentially impact the forecast."</td><td class="wrapcell">Give your best estimate and a confidence level.</td></tr>
</tbody></table></div>
<h2>A quick self-check</h2>
<p>Before you send the pack, read only the commentary, not the tables, and ask:</p>
<ul><li>Could a reader tell me what happened this month and why?</li><li>Do they know which variances will reverse?</li><li>Do they know what changed in the full-year forecast?</li><li>Is every decision needed clearly stated, with an owner?</li></ul>
<p>If the answer to all four is yes, your commentary will be read. If not, keep editing. It is the highest-leverage writing an FP&A team does each month.</p>`},

{id:"rolling-forecast-lessons",date:"2026-10-07",tag:"Forecasting",title:"Five lessons from moving to a rolling forecast",
 dek:"Rolling forecasts promise better visibility and less budgeting pain. Many teams try them and quietly drift back. Here are the design choices that make the difference, with a worked accuracy example and a 90-day rollout plan.",
 body:`<p>"We want to move to a rolling forecast" is one of the most common goals I hear from finance leaders. The logic is compelling. A traditional forecast to fiscal year-end gets shorter every month: by October, you're forecasting two months ahead and making hiring and investment decisions blind to anything beyond December. A rolling forecast always looks the same distance ahead, typically 12 to 18 months, and adds a new period each time one closes.</p>
<p>Yet many teams that start a rolling forecast end up back where they began: an annual budget, a mid-year re-forecast, and a monthly "latest estimate" that's really just year-to-date actuals plus the remaining budget. The difference between success and drift comes down to a handful of design choices.</p>

<h2>First, what a rolling forecast is (and isn't)</h2>
<div class="tablewrap"><table><thead><tr><th></th><th style="text-align:left">Annual budget</th><th style="text-align:left">Rolling forecast</th></tr></thead><tbody>
<tr><td>Purpose</td><td class="txt">A target and a commitment</td><td class="txt">Best estimate of what will happen</td></tr>
<tr><td>Horizon</td><td class="txt">Fixed fiscal year</td><td class="txt">Fixed length ahead (e.g. 12–18 months)</td></tr>
<tr><td>Frequency</td><td class="txt">Once a year</td><td class="txt">Monthly or quarterly</td></tr>
<tr><td>Detail</td><td class="txt">Often line-by-line</td><td class="txt">Driver-level</td></tr>
<tr><td>Changes?</td><td class="txt">No, it's the yardstick</td><td class="txt">Yes, every cycle</td></tr>
</tbody></table></div>
<p>A rolling forecast does not replace targets. It complements them. Keeping that distinction clear is the second lesson below.</p>

<h2>Lesson 1: Forecast drivers, not accounts</h2>
<p>The fastest way to kill a rolling forecast is to ask budget owners to re-forecast every general ledger line every month. If there are 400 lines across 30 cost centres, that's 12,000 numbers a month. People will copy last month's numbers forward, and the forecast becomes stale within two cycles.</p>
<p>Instead, identify the 10 to 20 drivers that explain most of the variance in your P&L, and forecast those:</p>
<ul><li><b>Revenue:</b> customers, volume, price, conversion, utilisation and bill rates for services businesses.</li><li><b>People costs:</b> headcount by role, start dates, average loaded cost.</li><li><b>Variable costs:</b> cost of sales as a % of revenue, commissions as a % of bookings.</li><li><b>Everything else:</b> run-rate with known step changes (a new office, a price increase).</li></ul>
<p>In a professional services business, for example, revenue is driven by consultants × available hours × utilisation × bill rate. Forecasting those four drivers by practice gives a better revenue forecast than asking every account lead for a number, and it updates in minutes.</p>

<h2>Lesson 2: Separate the target from the forecast</h2>
<p>When the forecast becomes the new target, people start managing it. Sales leaders sandbag to make sure they beat it; cost owners pad it to protect their budgets. The forecast stops being a best estimate and becomes a negotiation.</p>
<p>Keep three numbers visible and distinct:</p>
<ol><li><b>Target (AOP):</b> what we committed to. It does not change during the year.</li><li><b>Forecast:</b> our honest best estimate. It changes every cycle.</li><li><b>Gap:</b> the difference, and the actions to close it.</li></ol>
<p>Leadership conversations then focus on the gap and the actions, not on arguing about the forecast. The <a href="#tpl-rolling-forecast">rolling forecast template</a> on this site shows forecast and AOP side by side for exactly this reason.</p>

<h2>Lesson 3: Vary the detail by horizon</h2>
<p>Precision far into the future is false precision. A sensible structure:</p>
<ul><li><b>Months 1–3:</b> monthly, driver-level, with known specifics (signed deals, confirmed hires).</li><li><b>Months 4–12:</b> monthly or quarterly, driver-level, with trend assumptions.</li><li><b>Months 13–18:</b> quarterly, high-level drivers only.</li></ul>
<p>This keeps the effort proportional to the value. Nobody needs a forecast of stationery spend 14 months out.</p>

<h2>Lesson 4: Measure accuracy and bias, every cycle</h2>
<p>A forecast that's never measured never improves. Track two metrics for each major driver and P&L line.</p>
<div class="formula">Forecast accuracy = 1 − |Actual − Forecast| ÷ Actual
Bias               = Σ (Forecast − Actual) ÷ Σ Actual</div>
<p>Accuracy tells you how far off you were. Bias tells you whether you're consistently too high or too low, and bias is more useful because it's fixable. Here's a worked example for revenue over six months:</p>
<div class="tablewrap"><table><thead><tr><th>Month</th><th>Forecast ($k)</th><th>Actual ($k)</th><th>Error</th><th>Accuracy</th></tr></thead><tbody>
<tr><td>Jan</td><td>520</td><td>498</td><td>+22</td><td>95.6%</td></tr>
<tr><td>Feb</td><td>540</td><td>512</td><td>+28</td><td>94.5%</td></tr>
<tr><td>Mar</td><td>575</td><td>569</td><td>+6</td><td>98.9%</td></tr>
<tr><td>Apr</td><td>560</td><td>531</td><td>+29</td><td>94.5%</td></tr>
<tr><td>May</td><td>590</td><td>566</td><td>+24</td><td>95.8%</td></tr>
<tr><td>Jun</td><td>610</td><td>604</td><td>+6</td><td>99.0%</td></tr>
<tr class="subtotal"><td>Total</td><td>3,395</td><td>3,280</td><td>+115</td><td>Bias +3.5%</td></tr>
</tbody></table></div>
<p>Accuracy looks fine every month, around 95–99%. But the forecast was too high in all six months, a consistent +3.5% bias. That pattern points to a systematic cause, such as sales stage probabilities that are too optimistic. Fix the cause, and accuracy improves for good.</p>

<h2>Lesson 5: Tie the forecast to decisions</h2>
<p>A forecast that doesn't change a decision is a reporting exercise, and people will treat it as one. The rolling forecast should feed a monthly or quarterly forum where leadership decides things:</p>
<ul><li>Hiring: accelerate, hold or defer roles based on the revenue outlook.</li><li>Investment: release or hold discretionary spend.</li><li>Capacity: redeploy people between practices or regions ahead of shortfalls.</li><li>Pricing and commercial actions to close the gap to target.</li></ul>
<p>When budget owners see their forecast inputs lead to real decisions, the quality of those inputs goes up.</p>

<h2>Who owns what</h2>
<p>A rolling forecast involves many contributors. Clear ownership keeps it moving:</p>
<div class="tablewrap"><table><thead><tr><th>Role</th><th style="text-align:left">Responsibility</th></tr></thead><tbody>
<tr><td>Driver owners</td><td class="wrapcell">Sales, HR, operations leads update the drivers they control (pipeline, hiring, volumes)</td></tr>
<tr><td>FP&A</td><td class="wrapcell">Runs the process, maintains the model, challenges assumptions, publishes accuracy</td></tr>
<tr><td>CFO / finance lead</td><td class="wrapcell">Approves the forecast and chairs the decision forum</td></tr>
<tr><td>Leadership team</td><td class="wrapcell">Acts on the gap to target: approves, defers or reallocates</td></tr>
</tbody></table></div>

<h2>A sample monthly cycle</h2>
<ol><li><b>WD1–3:</b> books close; actuals load into the model automatically.</li><li><b>WD4–6:</b> driver owners update their drivers in the planning tool; trends pre-populate so they only change what has changed.</li><li><b>WD7:</b> FP&A reviews, challenges outliers, and checks accuracy and bias from last cycle.</li><li><b>WD8:</b> the forecast is locked and compared with target; the gap and options are summarised on one page.</li><li><b>WD9–10:</b> leadership forum decides actions; decisions are logged and fed back into the next cycle.</li></ol>
<p>A cycle like this takes days, not weeks, once drivers are agreed and data flows automatically. That's what makes monthly cadence sustainable.</p>

<h2>Excel or a planning platform?</h2>
<p>Small businesses can run a good rolling forecast in a well-built spreadsheet. Once you have many contributors, multiple scenarios, or several connected plans (workforce, revenue, capex), a connected planning platform makes the process far more sustainable: contributors input directly, actuals load automatically, and scenarios run in minutes. Either way, the design choices above matter more than the tool.</p>
<h2>Why rolling forecasts fail</h2>
<div class="tablewrap"><table><thead><tr><th>Failure mode</th><th style="text-align:left">What it looks like</th><th style="text-align:left">Fix</th></tr></thead><tbody>
<tr><td>Forecast fatigue</td><td class="wrapcell">Owners copy numbers forward</td><td class="wrapcell">Fewer drivers; pre-populate with trends</td></tr>
<tr><td>Target creep</td><td class="wrapcell">Forecast is negotiated like a budget</td><td class="wrapcell">Separate target, forecast and gap</td></tr>
<tr><td>Spreadsheet sprawl</td><td class="wrapcell">Dozens of files, days of consolidation</td><td class="wrapcell">One model; connected planning tool where scale demands it</td></tr>
<tr><td>No feedback</td><td class="wrapcell">Accuracy never measured</td><td class="wrapcell">Publish accuracy and bias by driver monthly</td></tr>
<tr><td>No decisions</td><td class="wrapcell">Forecast is presented, then filed</td><td class="wrapcell">Link to a monthly decision forum</td></tr>
</tbody></table></div>

<h2>A 90-day rollout plan</h2>
<ol><li><b>Days 1–30: Design.</b> Identify drivers and owners. Agree horizon and granularity. Build the model with actuals history so trends pre-populate.</li><li><b>Days 31–60: Pilot.</b> Run one cycle in parallel with the existing process for two or three business units. Measure effort and compare outputs.</li><li><b>Days 61–90: Launch.</b> Roll out company-wide, start publishing accuracy and bias, and set up the decision forum.</li></ol>
<p>Done well, a rolling forecast makes the annual budget smaller and faster, because the first year of next year's plan is already built. It also changes the role of FP&A, from producing a number once a year to guiding decisions every month.</p>`},

{id:"fpa-and-ai",date:"2026-09-16",tag:"Future of FP&A",title:"What AI actually changes in FP&A (and what it doesn't)",
 dek:"AI is good at data preparation, first drafts and pattern-spotting. It isn't good at owning assumptions or changing a leader's mind. A task-by-task view, practical use cases, the controls you need, and the skills to build now.",
 body:`<p>AI tools can now draft variance commentary, reconcile datasets, generate baseline forecasts and answer questions about a P&L in plain English. Planning platforms are adding AI features every release. It's reasonable for anyone in FP&A to ask: what does this mean for my job?</p>
<p>My view, from working on finance transformation projects, is that AI changes <i>how the work gets done</i> far more than <i>what the work is for</i>. The purpose of FP&A is still to help leaders make better decisions about resources. AI shrinks the time spent gathering and preparing information, and raises the bar on interpretation and influence.</p>

<h2>A task-by-task view</h2>
<p>It's more useful to look at individual tasks than at "FP&A" as a whole. Here's how I'd classify the common ones:</p>
<div class="tablewrap"><table><thead><tr><th>Task</th><th style="text-align:left">AI role</th><th style="text-align:left">Why</th></tr></thead><tbody>
<tr><td>Data extraction & mapping</td><td class="txt"><span class="pill ok">Automate</span></td><td class="wrapcell">Repetitive, rules-based, easy to check</td></tr>
<tr><td>Reconciliations</td><td class="txt"><span class="pill ok">Automate</span></td><td class="wrapcell">Matching and exception-flagging at scale</td></tr>
<tr><td>Baseline statistical forecasts</td><td class="txt"><span class="pill mid">Augment</span></td><td class="wrapcell">Good for stable, high-volume lines; poor at structural breaks</td></tr>
<tr><td>Variance calculation & flags</td><td class="txt"><span class="pill ok">Automate</span></td><td class="wrapcell">Deterministic once thresholds are set</td></tr>
<tr><td>First-draft commentary</td><td class="txt"><span class="pill mid">Augment</span></td><td class="wrapcell">Good at the "what"; needs a human for the "why"</td></tr>
<tr><td>Scenario generation</td><td class="txt"><span class="pill mid">Augment</span></td><td class="wrapcell">Fast to build; someone must judge plausibility</td></tr>
<tr><td>Setting assumptions</td><td class="txt"><span class="pill bad">Human</span></td><td class="wrapcell">Requires accountability and business context</td></tr>
<tr><td>Recommending actions</td><td class="txt"><span class="pill bad">Human</span></td><td class="wrapcell">Trade-offs, politics, risk appetite</td></tr>
<tr><td>Influencing decisions</td><td class="txt"><span class="pill bad">Human</span></td><td class="wrapcell">Trust and relationships</td></tr>
</tbody></table></div>

<h2>What gets faster</h2>
<h3>Data preparation</h3>
<p>Most FP&A analysts still spend a large share of their week pulling data from ERP, CRM and HR systems, cleaning it, mapping it to reporting structures and fixing breaks. This is where AI, and automation more broadly, delivers the biggest time savings. Connected planning platforms already remove much of it by integrating source data through a hub; AI extends that to messier, less structured sources.</p>
<h3>Baseline forecasts</h3>
<p>For lines with stable patterns (recurring costs, high-volume transactional revenue, seasonal demand), statistical and machine-learning models produce decent baselines quickly. They are a starting point. They don't know that your largest customer is renegotiating, or that a new competitor launched last week.</p>
<h3>First drafts</h3>
<p>Language models are good at turning a table into readable sentences: "Revenue was $310k below budget, driven by the enterprise segment." That's a useful first draft. The analyst's job becomes adding the cause, the timing judgment and the implication, which is the part leaders actually care about.</p>

<h2>What doesn't change</h2>
<h3>Knowing the business</h3>
<p>A model can tell you that utilisation fell in one practice. Only someone who talks to the practice lead knows it's because a large project paused for a client reorganisation and will restart in six weeks. That context determines whether the right action is redeployment, patience or a hiring freeze.</p>
<h3>Owning assumptions</h3>
<p>Every forecast embeds choices: growth rates, churn, hiring timing, price changes. Someone has to own those choices and defend them to the CFO and the board. "The model said so" is not an acceptable answer, and it shouldn't be.</p>
<h3>Influence</h3>
<p>The most valuable FP&A professionals change decisions. That requires credibility, timing and the ability to explain a trade-off in the language of the person making it. These are human skills, and AI makes them more valuable, not less, because more of the analyst's time is now available for them.</p>

<h2>Practical use cases to try now</h2>
<ul><li><b>Commentary drafting:</b> feed the variance table and owner notes to an AI tool and ask for a draft in your four-part structure (cause, impact, type, implication). Edit, don't accept.</li><li><b>Anomaly detection:</b> flag unusual transactions or sudden changes in run-rate before month-end close.</li><li><b>Natural-language Q&A:</b> let budget owners ask "why is my travel over budget?" against a governed dataset rather than emailing FP&A.</li><li><b>Scenario starters:</b> ask for a downside scenario with stated assumptions, then review and adjust each assumption yourself.</li><li><b>Documentation:</b> generate first drafts of model documentation and process notes, a task that's often skipped.</li></ul>

<h2>A worked example: one month-end, before and after</h2>
<p>To make this concrete, here's how a typical month-end reporting cycle changes when AI tools are used well. The example is a mid-sized business with 25 cost centres and a monthly management pack.</p>
<div class="tablewrap"><table><thead><tr><th>Step</th><th style="text-align:left">Without AI</th><th style="text-align:left">With AI, used well</th></tr></thead><tbody>
<tr><td>Data pull</td><td class="wrapcell">Analyst exports six reports, pastes them into a workbook, fixes mapping breaks (half a day)</td><td class="wrapcell">Integrated feeds refresh automatically; AI flags unmapped accounts for review (under an hour)</td></tr>
<tr><td>Variance calc</td><td class="wrapcell">Formulas updated by hand, thresholds applied by eye</td><td class="wrapcell">Variances and materiality flags calculated automatically</td></tr>
<tr><td>Anomalies</td><td class="wrapcell">Found late, often by the CFO</td><td class="wrapcell">Unusual postings flagged before close is locked</td></tr>
<tr><td>Commentary</td><td class="wrapcell">Analyst writes 30 explanations from scratch</td><td class="wrapcell">AI drafts the "what" for flagged lines; analyst calls owners and writes the "why" and implication</td></tr>
<tr><td>Review</td><td class="wrapcell">Finance lead checks numbers and wording</td><td class="wrapcell">Finance lead focuses on judgment calls and the headline</td></tr>
</tbody></table></div>
<p>The time saved doesn't disappear. In the best teams, it moves to the conversations that improve the forecast: talking to budget owners, testing assumptions, and preparing options for leadership. If the time saved simply turns into more reports, the team has automated the wrong thing.</p>

<h2>How AI fits into a connected planning landscape</h2>
<p>AI works best on top of clean, governed, connected data. That's why connected planning and AI reinforce each other. A planning platform with a central data hub gives AI one consistent version of actuals, master data and assumptions to work from. Without that foundation, AI tools end up summarising inconsistent spreadsheets, and their confident answers inherit every inconsistency.</p>
<p>If your organisation is choosing where to invest first, I'd argue for the foundation: integrate the data, agree the definitions, connect the plans. AI features become far more useful, and far safer, once that's in place.</p>

<h2>Questions to ask before adopting an AI tool</h2>
<ol><li>Which specific task will it speed up, and how will we measure the time saved?</li><li>What data will it see, and is that data approved for this use?</li><li>How will a human review its output before anyone relies on it?</li><li>Can it show how it reached an answer, or is it a black box?</li><li>What happens to the process if the tool is unavailable at month-end?</li></ol>
<h2>Risks and the controls you need</h2>
<div class="tablewrap"><table><thead><tr><th>Risk</th><th style="text-align:left">Control</th></tr></thead><tbody>
<tr><td>Confident but wrong output</td><td class="wrapcell">Reconcile AI outputs to source totals; never publish unreviewed numbers</td></tr>
<tr><td>Hidden assumptions</td><td class="wrapcell">Require every forecast to list its assumptions and an owner</td></tr>
<tr><td>Data leakage</td><td class="wrapcell">Use approved tools only; don't paste confidential data into public services</td></tr>
<tr><td>Loss of understanding</td><td class="wrapcell">Analysts must be able to explain every number they present</td></tr>
<tr><td>Inconsistent definitions</td><td class="wrapcell">Govern metric definitions centrally; AI uses the governed layer</td></tr>
</tbody></table></div>

<h2>What this means for your career</h2>
<p>The analyst whose main value is building and maintaining spreadsheets is the most exposed. The analyst whose value is interpreting numbers, challenging assumptions and influencing decisions becomes more valuable, because they can now do more of it.</p>
<p>If I were early in an FP&A career today, I would invest in:</p>
<ol><li><b>Business knowledge.</b> Learn how your company actually makes money, operationally.</li><li><b>Planning technology.</b> Understand how connected planning platforms, data hubs and integrations work, not just Excel.</li><li><b>Critical review.</b> Get good at spotting when an output is wrong or an assumption is weak.</li><li><b>Storytelling.</b> Practise turning analysis into a clear recommendation in three sentences.</li><li><b>Relationships.</b> Spend time with the people who run the business, not just the numbers.</li></ol>
<p>AI will take on more of the work that sits between data and insight. The work between insight and decision is still ours.</p>`},

{id:"model-design-questions",date:"2026-08-20",tag:"Modeling",title:"Ten questions to ask before you build a planning model",
 dek:"Most bad models are badly scoped, not badly built. These ten questions, each with examples and warning signs, will save you weeks of rework, whether you're building in Excel or Anaplan.",
 body:`<p>The fastest way to build a model nobody uses is to open Excel (or Anaplan) and start typing. Models built this way grow organically: a tab added here, a hard-coded adjustment there, a new scenario bolted on the side. Six months later, nobody, including the person who built it, fully understands how it works.</p>
<p>Spend thirty minutes answering these ten questions before you build. Write the answers down and share them with your stakeholders. It is the cheapest insurance in modelling.</p>

<h2>1. What decision will this model support?</h2>
<p>A model is a tool for making a decision. If you can't name the decision, you can't design the model. "Understand our costs" is not a decision; "decide whether to open a second office next year" is.</p>
<p><b>Warning sign:</b> the request is "we need a model for X" with no mention of what anyone will do with the answer.</p>

<h2>2. Who will use it, and how often?</h2>
<p>A one-off board analysis built by one analyst and a monthly forecasting tool used by 40 budget owners need completely different designs. The first can be quick and focused. The second needs input controls, clear navigation, protection against accidental changes, and probably a planning platform rather than a shared spreadsheet.</p>
<div class="tablewrap"><table><thead><tr><th>Use</th><th style="text-align:left">Design implications</th></tr></thead><tbody>
<tr><td>One-off analysis</td><td class="wrapcell">Speed matters; document assumptions; archive when done</td></tr>
<tr><td>Recurring, single owner</td><td class="wrapcell">Clean structure, checks, refreshable data links</td></tr>
<tr><td>Recurring, many contributors</td><td class="wrapcell">Input forms, access control, audit trail, workflow; consider a connected planning tool</td></tr>
</tbody></table></div>

<h2>3. What is the right level of detail?</h2>
<p>Detail is expensive. Every extra product, region or month multiplies the size of the model and the effort to maintain it. Choose the level that matches the decision:</p>
<ul><li>Monthly or weekly? Cash forecasting often needs weekly; a long-range plan needs annual.</li><li>SKU or product family? Pricing decisions might need SKUs; a budget rarely does.</li><li>Employee or role? Workforce planning needs positions; a P&L forecast may only need FTE by department.</li></ul>
<p>In Anaplan, this question directly drives model size, since every dimension multiplies cells. A line item by 1,200 employees × 400 projects × 36 months × 3 versions is already over 51 million cells.</p>

<h2>4. Which 5–10 inputs matter most?</h2>
<p>Most models have a small number of inputs that drive most of the output. Identify them early, put them on a single clearly labelled input sheet (or input module), and make them easy to change. A quick sensitivity test, flexing each input by ±10% and watching the output, tells you which ones matter.</p>
<p><b>Warning sign:</b> key assumptions are scattered across tabs or buried inside formulas.</p>

<h2>5. Where does the data come from, and how often does it refresh?</h2>
<p>List every data source, its owner, its format and how often it updates. Then decide how it gets into the model: manual paste, a linked query, or an automated integration. A model that depends on someone manually pasting five exports every month will break the first time that person is on holiday.</p>
<p>For larger solutions, a central data hub that loads and cleans data once, then feeds every planning model, prevents different models from disagreeing about the same numbers.</p>

<h2>6. Which scenarios are needed?</h2>
<p>If leadership will ask "what if volume drops 15%?", design for it from the start. Retrofitting scenarios into a model built for a single case is painful. Build one scenario selector (in Excel, a dropdown that drives a CHOOSE or INDEX; in Anaplan, a version or scenario dimension) and make every scenario-sensitive input respond to it.</p>

<h2>7. What outputs does the audience need?</h2>
<p>Sketch the final table, chart or dashboard on paper before you build anything. Show it to the audience. Then work backwards: what calculations produce that output, and what inputs feed those calculations? Building outputs first avoids the common trap of a technically impressive model that doesn't answer the question in the format the reader needs.</p>

<h2>8. What checks will prove it's right?</h2>
<p>Every model needs built-in checks that flag errors automatically. Common ones:</p>
<ul><li>Totals reconcile to source data (revenue in the model = revenue in the ERP).</li><li>Balance sheet balances (assets − liabilities − equity = 0).</li><li>Phasing totals 100%.</li><li>Price-volume-mix effects add up to the total variance.</li><li>No negative values where they're impossible (headcount, inventory).</li></ul>
<p>Put all checks on one summary sheet with a single "all checks pass" indicator. Every template on this site includes checks like these; the <a href="#tpl-price-volume-mix">PVM template</a>, for example, confirms that the effects reconcile to zero.</p>

<h2>9. Who maintains it after you?</h2>
<p>You won't own this model forever. Someone will inherit it, possibly with no handover. Design for them:</p>
<ul><li>A cover sheet explaining purpose, structure and how to update it.</li><li>Consistent colour coding (for example, blue for inputs, black for formulas, green for links).</li><li>Short formulas. If a formula doesn't fit on one screen, split it.</li><li>A change log noting what changed, when, and why.</li></ul>

<h2>10. What's good enough, and by when?</h2>
<p>A rough answer on time beats a perfect answer late. Agree the deadline and the acceptable level of precision upfront. Then build the simplest version that answers the question, and improve it only if the decision warrants it.</p>

<h2>A worked example: scoping a headcount model</h2>
<p>Here's how the ten questions shaped a real-world style request: "We need a headcount model for next year's budget."</p>
<div class="tablewrap"><table><thead><tr><th>Question</th><th style="text-align:left">Answer</th></tr></thead><tbody>
<tr><td>Decision</td><td class="wrapcell">How many roles to approve per department, and when they should start, within a people-cost envelope</td></tr>
<tr><td>Users</td><td class="wrapcell">FP&A builds; 8 department heads submit requests once, then review monthly</td></tr>
<tr><td>Detail</td><td class="wrapcell">Position level, monthly; salary bands rather than individual salaries for planned roles</td></tr>
<tr><td>Key inputs</td><td class="wrapcell">Start month, salary band, burden rate by department, merit % and month, attrition rate</td></tr>
<tr><td>Data</td><td class="wrapcell">HR system export of current employees (monthly); open roles from recruiting tracker</td></tr>
<tr><td>Scenarios</td><td class="wrapcell">Base, hiring delayed one quarter, hiring freeze from mid-year</td></tr>
<tr><td>Outputs</td><td class="wrapcell">Monthly cost and FTE by department; next-year run-rate; open vs planned roles</td></tr>
<tr><td>Checks</td><td class="wrapcell">Current headcount reconciles to HR; no start month outside 1–12; total cost within envelope</td></tr>
<tr><td>Owner</td><td class="wrapcell">FP&A manager; documented on a cover sheet</td></tr>
<tr><td>Deadline</td><td class="wrapcell">Two weeks before budget submissions open; ±2% precision is fine</td></tr>
</tbody></table></div>
<p>With those answers agreed, the build took a fraction of the time it would have taken to iterate on an unclear brief. The <a href="#tpl-headcount-plan">headcount template</a> on this site follows the same structure.</p>

<h2>Common modelling mistakes these questions prevent</h2>
<ul><li><b>The everything model:</b> trying to answer every possible question in one workbook. It becomes slow, fragile and impossible to hand over.</li><li><b>Hard-coded overrides:</b> typing a number over a formula "just this once". It silently breaks the logic next month.</li><li><b>Hidden assumptions:</b> a growth rate inside a formula instead of on the input sheet. Nobody can see or challenge it.</li><li><b>Circular references:</b> often from interest on average cash. If you need one, isolate it behind a switch.</li><li><b>No version control:</b> "Budget_v7_final_FINAL.xlsx". Agree a naming and storage convention on day one.</li></ul>

<h2>When to move beyond Excel</h2>
<p>Excel is the right tool for many models. It's flexible, universal and fast to build in. Signs that you've outgrown it:</p>
<ul><li>Many people need to input at the same time, and consolidation takes days.</li><li>The file is so large it's slow to open or calculate.</li><li>You need an audit trail of who changed what.</li><li>Several models need the same master data and keep drifting apart.</li><li>Leadership wants scenarios run in a meeting, not overnight.</li></ul>
<p>At that point, a connected planning platform is worth considering. The ten questions still apply. In fact, they matter more, because design decisions in a platform are harder to reverse.</p>
<h2>The structure that follows from the answers</h2>
<p>Whatever tool you use, the same separation of concerns applies:</p>
<div class="tablewrap"><table><thead><tr><th>Layer</th><th style="text-align:left">Excel</th><th style="text-align:left">Anaplan (DISCO)</th></tr></thead><tbody>
<tr><td>Data</td><td class="txt">Raw data tabs, untouched</td><td class="txt">Data modules loaded via the Data Hub</td></tr>
<tr><td>Inputs</td><td class="txt">One assumptions sheet</td><td class="txt">Input modules with user access</td></tr>
<tr><td>Mappings</td><td class="txt">Lookup tables</td><td class="txt">System modules</td></tr>
<tr><td>Calculations</td><td class="txt">Calculation tabs, no inputs</td><td class="txt">Calculation modules</td></tr>
<tr><td>Outputs</td><td class="txt">Report and chart tabs</td><td class="txt">Output modules and dashboards</td></tr>
</tbody></table></div>
<div class="callout"><strong>One-page scoping template:</strong> Decision · Users and frequency · Granularity · Key inputs · Data sources and refresh · Scenarios · Outputs (sketch) · Checks · Owner after handover · Deadline and precision. Fill it in, get sign-off, then build.</div>`},

{id:"requirements-to-user-stories",date:"2026-07-15",tag:"Delivery",title:"From workshop notes to user stories: a finance consultant's guide",
 dek:"How to run discovery workshops with finance stakeholders, turn messy notes into user stories developers can build from, write acceptance criteria that become UAT scripts, and keep the business engaged through delivery.",
 body:`<p>Anyone who works between finance and technology knows the moment: a two-hour workshop ends, and you have twelve pages of notes, three whiteboard photos and a list of requests that range from "a button to export to Excel" to "better visibility of our capex". Somewhere in there is a solution. Your job is to find it, describe it clearly enough that a developer can build it, and make sure what gets built is what the business needs.</p>
<p>This is the process I use, refined across several planning implementations, from requirements gathering through to UAT.</p>

<h2>Step 1: Prepare the workshop around decisions</h2>
<p>Good requirements start before the workshop. Send a short pre-read that asks attendees to think about three things:</p>
<ol><li>What decisions do you make using this process today?</li><li>What slows you down or makes you doubt the numbers?</li><li>What would you do differently if you had better information?</li></ol>
<p>Invite the people who do the work, not just their managers. The analyst who consolidates 30 spreadsheets every quarter knows exactly where the process breaks.</p>

<h2>Step 2: Run the workshop as a walkthrough</h2>
<p>Ask attendees to walk you through the current process step by step, using real files. Capture each step on a whiteboard: who does it, what data they use, where it comes from, where it goes next. You'll quickly see handoffs, manual workarounds and duplicated effort.</p>
<p>On a capex planning project, this walkthrough revealed more than 50 handoffs between asset teams, regional finance and central planning. Those handoffs, not any calculation, were the real problem, and seeing them on one wall made the case for a connected model obvious to everyone in the room.</p>

<h2>Step 3: Turn notes into user stories</h2>
<p>After the workshop, convert every request into a user story using a standard format:</p>
<div class="formula">As a [role], I need [capability] so that [outcome].</div>
<p>The format forces three things that raw notes usually lack: who needs it, what exactly they need, and why. The "why" matters most, because it lets you find a better solution than the one the user asked for.</p>
<div class="tablewrap"><table><thead><tr><th>Weak story</th><th style="text-align:left">Strong story</th></tr></thead><tbody>
<tr><td class="wrapcell">"Export to Excel button"</td><td class="wrapcell">As a regional finance lead, I need to share capex phasing by asset with asset managers who don't have access, so that they can confirm timing before the quarterly forecast.</td></tr>
<tr><td class="wrapcell">"Better visibility of projects"</td><td class="wrapcell">As a portfolio manager, I need to see every proposed project ranked by weighted score with a funding line at the annual budget, so that the steering committee only debates projects near the line.</td></tr>
<tr><td class="wrapcell">"Utilisation report"</td><td class="wrapcell">As a practice lead, I need to see the 10 most and least utilised consultants each month, so that I can rebalance workload and deploy bench capacity.</td></tr>
</tbody></table></div>
<p>Notice the first example. The user asked for an export button, but the underlying need is sharing with people who lack access. That might be better solved with a read-only dashboard, which avoids uncontrolled spreadsheets reappearing.</p>

<h2>Step 4: Add acceptance criteria</h2>
<p>Every story needs two to five acceptance criteria: specific, testable statements that define "done". Write them in plain language using a Given / When / Then pattern where it helps:</p>
<div class="callout"><strong>Story:</strong> As a portfolio manager, I need projects ranked by weighted score with a funding line, so that the committee only debates projects near the line.<br><br><strong>Acceptance criteria:</strong><br>1. Given criteria weights that total 100%, each project's weighted score is the sum of its criterion scores × weights.<br>2. Projects are ranked from highest to lowest score; ties are broken by lower cost.<br>3. Projects are bucketed Fund / Review / Defer using thresholds set by an administrator.<br>4. Cumulative cost by rank is shown, and projects beyond the budget are marked "Not funded".<br>5. If weights don't total 100%, a warning appears and scores don't recalculate.</div>
<p>These criteria do double duty. They tell the developer exactly what to build, and they become your UAT test scripts later. On one engagement, more than 20 test scripts came directly from acceptance criteria written this way.</p>

<h2>Step 5: Size and prioritise</h2>
<p>With stories written, estimate effort with the developers. Relative sizing (small / medium / large, or story points) works better than hours for planning work, which often involves unknowns in data and integration.</p>
<p>Then prioritise with the business. MoSCoW is simple and effective:</p>
<ul><li><b>Must have:</b> the release fails without it.</li><li><b>Should have:</b> important, but there's a workaround.</li><li><b>Could have:</b> nice to have if time allows.</li><li><b>Won't have (this release):</b> agreed and parked, not forgotten.</li></ul>
<p>The first release should solve the most painful problem end to end, even if it's narrow. A complete solution for one use case builds more trust than a partial solution for five.</p>

<h2>Step 6: Plan sprints and assign by expertise</h2>
<p>Group stories into sprints of one to three weeks. Assign work based on each developer's strengths: data integration, complex calculations or dashboard design. Keep a visible board (Jira or similar) so the business can see progress without asking.</p>

<h2>Step 7: Demo every sprint</h2>
<p>Short demos at the end of each sprint are the most effective way to keep stakeholders engaged and catch misunderstandings early. Fifteen minutes of "here's what we built, does it match what you need?" prevents weeks of rework.</p>
<p>Users who watched the model grow, sprint by sprint, are the ones who champion it at go-live. Users who see it for the first time in UAT are the ones who find reasons not to trust it.</p>

<h2>Step 8: Make UAT structured, not exploratory</h2>
<p>Give testers scripts, not a login and a blank page. Each script lists the steps, the expected result and space to record pass or fail. Track defects against stories, fix the critical ones, and re-test. Short walkthrough videos for each major feature help testers who aren't available for live sessions.</p>

<h2>Step 9: Keep traceability</h2>
<p>Maintain a simple traceability matrix linking each requirement to its user story, its build items, its test scripts and its UAT result. It sounds bureaucratic, but it answers the question every steering committee eventually asks: "Have we delivered what we agreed?"</p>
<div class="tablewrap"><table><thead><tr><th>Req</th><th>Story</th><th>Build</th><th>Test</th><th>Status</th></tr></thead><tbody>
<tr><td>R-07</td><td>US-12</td><td>Scoring module, ranking view</td><td>TS-12a, TS-12b</td><td class="txt"><span class="pill ok">Passed</span></td></tr>
<tr><td>R-08</td><td>US-13</td><td>Funding line calc</td><td>TS-13</td><td class="txt"><span class="pill mid">Retest</span></td></tr>
<tr><td>R-09</td><td>US-14</td><td>Idea-to-project workflow</td><td>TS-14a–c</td><td class="txt"><span class="pill ok">Passed</span></td></tr>
</tbody></table></div>

<h2>Working with finance stakeholders specifically</h2>
<p>Finance users have some particular habits worth planning for:</p>
<ul><li><b>They think in spreadsheets.</b> Show them prototypes with real numbers early. Abstract wireframes rarely land.</li><li><b>They need numbers to tie out.</b> Include reconciliation to source systems in the acceptance criteria, or UAT will stall on a $3 difference.</li><li><b>Their calendar is fixed.</b> Avoid UAT and go-live during month-end close or budget season.</li><li><b>Controls matter.</b> Ask early about approvals, audit trails and access rights; they're often unstated requirements.</li></ul>

<h2>Handling change requests mid-build</h2>
<p>New requests will arrive during the build. That's healthy: it means users are engaged. Handle them consistently:</p>
<ol><li>Write the request as a user story with acceptance criteria, just like the original backlog.</li><li>Size it with the developers.</li><li>Ask the business owner what it replaces, or whether it moves to a later release.</li><li>Record the decision in the backlog so nobody is surprised at UAT.</li></ol>
<p>The aim is not to refuse change. It's to make the trade-off visible, so the scope stays deliverable and the most valuable work gets done first.</p>
<h2>A template you can reuse</h2>
<div class="callout"><strong>User story card</strong><br>ID · Title<br>As a … I need … so that …<br>Acceptance criteria (2–5)<br>Priority (MoSCoW) · Size · Sprint<br>Dependencies (data, other stories)<br>Test script reference · UAT result</div>
<p>Good requirements work is invisible when it's done well. The model just does what people need, and nobody remembers the twelve pages of workshop notes it came from. That's the goal.</p>`}
];

{t:"Financial statements",q:"A company reports net income of $2M for the year, but its cash balance fell by $1M. Which is the most likely explanation?",o:["Revenue was recognised incorrectly","Growth tied up cash in receivables and inventory, and/or the company spent on capex or repaid debt","Depreciation was too high","The company overpaid tax"],a:1,
 e:"Profit and cash differ because of timing and classification. Net income includes revenue that's earned but not yet collected, and it excludes capital spending and debt repayments. If receivables and inventory grew, or the company invested in capex or repaid loans, cash can fall while profit is positive. Depreciation is a non-cash charge: a higher charge lowers profit but not cash, so it would make cash look better relative to profit, not worse."},
{t:"Variance analysis",q:"Actual travel spend is $180k against a budget of $150k. What's the best way to report it?",o:["$30k favorable (20%)","$30k unfavorable (20%)","$30k unfavorable (20%), with the business cause, whether it's timing or permanent, and the full-year impact","Don't report it; it's immaterial"],a:2,
 e:"For costs, spending above budget is unfavorable: $30k, or 20% of budget. The number alone isn't useful commentary. Good commentary adds the business cause (for example, a sales conference moved forward), whether the variance will reverse (timing) or not (permanent), and what it means for the full-year forecast. At 20%, it would breach most percentage materiality thresholds."},
{t:"Price-volume-mix",q:"Revenue beat budget by $200k, but gross margin % fell from 42% to 39%. Prices and unit costs were exactly on plan. What's the most likely driver?",o:["Higher volume across all products","An adverse product mix: more sales of lower-margin products","A favorable price effect","Lower fixed costs"],a:1,
 e:"If prices and unit costs were on plan, each product's margin per unit didn't change. The only way the blended margin % can fall while revenue rises is a shift in mix towards lower-margin products. A pure volume increase at the same mix would raise gross profit without changing the margin %. Running price-volume-mix on gross margin, not just revenue, would show a negative mix effect."},
{t:"Break-even",q:"Price is $40, variable cost is $25 a unit and fixed costs are $300,000. The company expects to sell 25,000 units. What is the margin of safety?",o:["10%","20%","25%","37.5%"],a:1,
 e:"Contribution per unit = $40 − $25 = $15. Break-even = $300,000 ÷ $15 = 20,000 units. Margin of safety = (25,000 − 20,000) ÷ 25,000 = 20%. Sales could fall by a fifth before the business makes a loss."},
{t:"Working capital",q:"Annual revenue is $73M. DSO falls from 60 to 50 days. Roughly how much cash is released?",o:["$0.2M","$1.0M","$2.0M","$10M"],a:2,

{t:"Forecast accuracy",q:"For six months, a revenue forecast was within 2–4% of actuals, but it was higher than actual every single month. What does this tell you?",o:["The forecast is accurate and needs no change","There's a consistent positive bias, and its cause should be fixed","The team should switch to a moving average","The actuals must be wrong"],a:1,
 e:"Monthly accuracy looks fine, but a forecast that's always too high has a systematic bias. Bias usually has a fixable cause, such as optimistic pipeline probabilities or price assumptions. Tracking bias (Σ forecast − Σ actual, divided by Σ actual) alongside accuracy exposes the pattern; accuracy alone hides it."},
{t:"Budget vs forecast",q:"Halfway through the year, the latest forecast shows EBITDA $1.5M below budget. What's best practice?",o:["Change the budget to match the forecast","Keep the budget as the target, report the gap and agree actions to close it","Raise the forecast so it meets budget","Stop reporting against budget"],a:1,
 e:"The budget (target) and the forecast (best estimate) do different jobs. Changing the budget hides under-performance, and pushing the forecast up destroys its value as an honest estimate. Keep the target fixed, show the gap clearly, and focus leadership on the actions that close it and their expected impact."},
{t:"Profitability",q:"Which statement about EBITDA is correct?",o:["EBITDA equals operating cash flow","EBITDA ignores capex, working capital and tax, so it can overstate cash generation","EBITDA is calculated after interest","EBITDA can't be negative"],a:1,
 e:"EBITDA is a useful proxy for operating profit before financing costs and depreciation choices. But it ignores capital expenditure, investment in working capital and taxes. A capital-intensive or fast-growing business can report strong EBITDA and still burn cash, which is why free cash flow matters too."},
{t:"Investment appraisal",q:"Project A has an NPV of $1.2M and an IRR of 14%. Project B has an NPV of $0.8M and an IRR of 22%. They're mutually exclusive, equally risky, and the WACC is 10%. Which should you choose?",o:["B, because it has the higher IRR","A, because it creates more value (higher NPV)","Neither, because the IRRs differ","It's impossible to say"],a:1,
 e:"Both clear the 10% hurdle. For mutually exclusive projects, NPV is the better decision rule because it measures the total value created in today's money. IRR is a percentage and can favour smaller projects with high returns but less absolute value. Use IRR as a supporting check, not the deciding metric."},
{t:"Headcount planning",q:"A role costing $120k a year (fully loaded) is budgeted to start in January but starts in May. What's the in-year saving?",o:["$40k this year, with no change to next year's run-rate","$40k this year and $40k next year","$120k","There's no saving"],a:0,
 e:"Four months unfilled (January to April) saves $120k × 4 ÷ 12 = $40k this year. Next year the person is in post all year, so the run-rate is the full $120k: the saving is one-off. The bigger risk is operational, since the team went four months without the capacity the role was meant to add."},
{t:"Driver-based planning",q:"Which is the best way to forecast a call centre's labour cost?",o:["Last year's cost plus inflation","Forecast call volume ÷ calls handled per agent × cost per agent","Revenue × a fixed percentage","Number of office locations × average cost"],a:1,
 e:"Call-centre labour cost is caused by call volume and agent productivity. Modelling volume ÷ productivity × cost per agent ties the forecast to what actually drives cost. It updates when volumes change and lets you test productivity improvements. Incremental or percentage-of-revenue methods ignore the real cause."},
{t:"Revenue recognition",q:"A customer signs a 2-year, $240k subscription on 1 July, billed annually in advance. How much revenue is recognised in the calendar year ending 31 December?",o:["$240k","$120k","$60k","$0"],a:2,
 e:"Revenue is recognised as the service is delivered: $240k over 24 months is $10k a month. July to December is six months, so $60k. Bookings are $240k, billings are $120k (the first annual invoice), and deferred revenue at 31 December is $120k − $60k = $60k."},
{t:"Financial ratios",q:"Net debt is $30M and EBITDA is $12M. The leverage covenant is 3.0x net debt / EBITDA. How far can EBITDA fall before the covenant is breached, if net debt doesn't change?",o:["$1M","$2M","$3M","$6M"],a:1,
 e:"Current leverage is $30M ÷ $12M = 2.5x. The covenant is breached when EBITDA falls to $30M ÷ 3.0 = $10M. Headroom is $12M − $10M = $2M of EBITDA, about 17%. FP&A should show this headroom in every forecast and downside scenario."},
{t:"Sensitivity analysis",q:"In a tornado chart, the 'price' bar is three times wider than the 'fixed costs' bar. What does that mean?",o:["Price is three times more likely to change","For the same % change, price moves profit about three times as much as fixed costs","Fixed costs can be ignored","Price is the only assumption that matters"],a:1,
 e:"A tornado chart flexes each assumption by the same amount (for example ±10%) and shows the effect on the output. A wider bar means the output is more sensitive to that assumption. It says nothing about how likely the change is, so combine sensitivity with judgment about likelihood when deciding where to focus."},
{t:"Unit economics",q:"ARPA is $500 a month, gross margin is 80%, monthly churn is 2% and CAC is $12,000. What are LTV:CAC and CAC payback?",o:["LTV:CAC 1.7x, payback 30 months","LTV:CAC 2.0x, payback 24 months","LTV:CAC 3.3x, payback 30 months","LTV:CAC 1.7x, payback 24 months"],a:0,
 e:"Gross-margin-adjusted ARPA is $500 × 80% = $400 a month. LTV = $400 ÷ 2% = $20,000, so LTV:CAC = $20,000 ÷ $12,000 ≈ 1.7x, below the common 3x benchmark. CAC payback = $12,000 ÷ $400 = 30 months, well above the 12–18 months many investors look for. Both point to acquisition costs that are too high or churn that's too fast."}

 {"id": "tpl-close-checklist", "file": "Month_End_Close_Checklist.xlsx", "kind": "Process", "title": "Month-end close toolkit", "desc": "Close calendar with due dates and status, balance sheet reconciliations, issues log, close metrics and a RACI matrix.", "sheets": ["Dashboard", "Settings", "Checklist", "Progress", "Reconciliations", "Issues Log", "Close Metrics", "RACI"], "features": ["Close dashboard", "Working-day calendar with WORKDAY due dates", "Status tracking and overdue flags by phase", "Balance sheet reconciliation tracker", "Issues log with P&L impact", "Days-to-close and flash accuracy trend", "RACI responsibility matrix"], "preview": "close"}
